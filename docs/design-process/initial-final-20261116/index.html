tion.hash=e.target.value;document.getElementById('prev').onclick=()=>location.hash=screens[active-1].id;document.getElementById('next').onclick=()=>location.hash=screens[active+1].id;addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1)||'06-plan');</script></body></html>
