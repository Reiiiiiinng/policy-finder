/a><a href="review.html">图文改进清单</a><a href="offline.html" download>单文件离线版</a></nav></main><dialog id="imageDialog"><div class="dialog-toolbar"><button id="closeImage" type="button">关闭图片</button><a id="downloadImage" href="#" download>下载原图</a></div><img id="zoomImage" alt="界面对比原图"></dialog><script>const dialog=document.getElementById('imageDialog'),zoom=document.getElementById('zoomImage');document.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;const img=b.querySelector('img')||document.getElementById(b.dataset.zoom);if(!img||!img.src)return;zoom.src=img.src;zoom.alt=img.alt;const d=document.getElementById('downloadImage');d.href=img.src;d.download=b.dataset.filename||'policy-finder-ui.jpg';dialog.showModal();});document.getElementById('closeImage').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});</script></body></html>
