<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>phase6 · 390×844</title>
<style>
  body{margin:0;font:12px/1.6 monospace;background:#101418;color:#dfe6ec}
  #log{padding:10px;white-space:pre-wrap;word-break:break-word;max-height:1000px;overflow:auto}
  .ok{color:#5fd38d}.bad{color:#ff7b72}.warn{color:#e3b341}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block;margin:0 auto}
  .bar{padding:4px 10px;background:#1c232b;color:#9fb0c0}
</style>
</head>
<body>
<div class="bar">视口 390 × 844 · 六个场景按序执行</div>
<div id="log">running…</div>
<iframe id="f"></iframe>
<script>
/*
 * 第六阶段 390×844 实测：对应需求里的测试1~测试6。
 * 每条断言通过 fetch POST 到 /__e2e_log（mode=phase6），由 .tools/phase6-e2e.py 读取。
 */
var W = 390, H = 844;
var log = document.getElementById('log');
var f = document.getElementById('f');
var lines = [], pass = 0, fail = 0;

function out(s, cls) {
  lines.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s);
  log.innerHTML = lines.join('\n');
  try {
    fetch('/__e2e_log', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'phase6', line:String(s), cls:cls||'' }) });
  } catch(e){}
}
function check(name, cond, extra) {
  if (cond) { pass++; out('  ok   ' + name, 'ok'); }
  else { fail++; out('  FAIL ' + name + (extra ? '  -> ' + extra : ''), 'bad'); }
}
function D(){ return f.contentDocument; }
function Wn(){ return f.contentWindow; }
function q(s){ try { return D().querySelector(s); } catch(e){ return null; } }
function qa(s){ try { return Array.prototype.slice.call(D().querySelectorAll(s)); } catch(e){ return []; } }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function waitFor(fn, ms, label){
  var t0=Date.now();
  while(Date.now()-t0<(ms||9000)){ try{ if(fn()) return true; }catch(e){} await sleep(100); }
  out('  ..超时: '+label, 'warn'); return false;
}
function load(url){
  return new Promise(function(res){
    f.addEventListener('load', function h(){ f.removeEventListener('load', h); res(); }, {once:true});
    f.src = url;
  });
}
/* 等待 iframe 发生一次导航（load 事件）。
   无头模式下 iframe.src 不会随导航及时刷新，不能用它判断是否已跳转。 */
function waitForEvent(ms){
  return new Promise(function(res){
    var to = setTimeout(function(){ res(false); }, ms || 12000);
    f.addEventListener('load', function h(){
      clearTimeout(to); f.removeEventListener('load', h); res(true);
    }, { once:true });
  });
}
function setSession(o){
  var cur = {};
  try { cur = JSON.parse(sessionStorage.getItem('policy_finder_session')||'{}'); } catch(e){}
  Object.keys(o).forEach(function(k){ cur[k]=o[k]; });
  sessionStorage.setItem('policy_finder_session', JSON.stringify(cur));
}
function clearSession(){ try{ sessionStorage.removeItem('policy_finder_session'); }catch(e){} }
function docTop(){ try { return D().documentElement.scrollTop; } catch(e){ return 0; } }
/* iframe 实际地址（同源可读；不要用 f.src 判断导航，无头下不刷新） */
function page(){ try { return Wn().location.pathname; } catch(e){ return ''; } }

async function run(){
  out('=== 第六阶段实测（390×844）===');

  /* ---------- 测试1：首页首屏信息层级（2026-10-20 首页重设计适配） ---------- */
  await load('/index.html');
  await sleep(600);
  var d1 = D();
  var hello = d1.querySelector('.home-hello');
  var entry = d1.querySelector('#entry');   /* 家庭画像卡承接旧入口区 id */
  var tiles = qa('.home-grid .hg-tile');
  check('测试1 首页可加载（欢迎区存在）', !!hello);
  check('测试1 旧大标题 hero 已移除', !d1.querySelector('.hero-title'));
  // 桌面无头模式下 iframe 内会出现 15px 滚动条，可用宽度略小于 390
  var vw = d1.documentElement.clientWidth;
  var vh = d1.documentElement.clientHeight;
  check('测试1 视口宽度接近 390（桌面滚动条占位）', vw >= 370 && vw <= W, 'clientW=' + vw);
  // 首屏（可见高度）内应看到欢迎区与家庭画像卡
  var entryTop = entry.getBoundingClientRect().top;
  var entryBottom = entry.getBoundingClientRect().bottom;
  check('测试1 家庭画像卡在首屏内可见', entryTop < vh, 'entry top=' + Math.round(entryTop));
  check('测试1 家庭画像卡完整显示（未截断）', entryBottom <= vh + 4,
    'entry bottom=' + Math.round(entryBottom) + ' vh=' + vh);
  check('测试1 服务宫格 2×2 四项齐全', tiles.length === 4, 'n=' + tiles.length);
  // 首屏优先级：发现动态卡排在画像卡之后；底部导航四项齐全
  var dc = d1.querySelector('.home-discover');
  var dcTop = dc ? dc.getBoundingClientRect().top : 1e9;
  check('测试1 发现动态卡排在画像卡之后', dcTop >= entryBottom - 4,
    'dc=' + Math.round(dcTop) + ' entryBottom=' + Math.round(entryBottom));
  check('测试1 底部导航四项齐全', qa('.tabbar .tab-item').length === 4,
    'n=' + qa('.tabbar .tab-item').length);
  // 绿智共生不在首屏、不在 topbar
  var tag = d1.querySelector('.topbar .theme-tag');
  check('测试1 topbar 已无「绿智共生」标签', tag === null);
  var themeTagInTop = d1.querySelector('.topbar').textContent.indexOf('绿智共生') >= 0;
  check('测试1 首屏无「绿智共生」字样', !themeTagInTop);
  check('测试1 赛事主题仍在页面（页脚）', d1.body.textContent.indexOf('绿智共生') >= 0);
  // 欢迎标题为首页显著大字号（重设计后 20px，仍显著大于页脚 11.5px）
  var fs = parseFloat(getComputedStyle(hello).fontSize);
  check('测试1 欢迎标题是显著大字号', fs >= 18, fs + 'px');
  // 无横向溢出
  check('测试1 无横向滚动', d1.documentElement.scrollWidth <= vw + 1,
    'scrollW=' + d1.documentElement.scrollWidth + ' clientW=' + vw);

  /* ---------- 测试2：我的父母 → 优先父亲/母亲 ---------- */
  clearSession();
  setSession({ target:'parents', operator:'女儿', beneficiary:'', confirmed:false, profile:{} });
  await load('/family.html');
  await sleep(700);
  var main = qa('#beneficiaryGrid .choice');
  var mainRoles = main.map(function(b){ return b.dataset.role; });
  var altRoles = qa('#altBody .choice').map(function(b){ return b.dataset.role; });
  check('测试2 我的父母：主区只显示 父亲/母亲',
    mainRoles.length === 2 && mainRoles[0] === '父亲' && mainRoles[1] === '母亲', mainRoles.join(','));
  check('测试2 祖辈与配偶收进「其他关系」',
    altRoles.length === 6 && altRoles.indexOf('爷爷') >= 0 && altRoles.indexOf('配偶') >= 0,
    altRoles.join(','));
  var altHidden = q('#altBody').hidden;
  check('测试2 其他关系默认折叠', altHidden === true);
  // 折叠区可展开，且能选中
  q('#altToggle').click();
  await sleep(150);
  check('测试2 其他关系可展开', q('#altBody').hidden === false);
  q('#altBody .choice[data-role="奶奶"]').click();
  await sleep(200);
  check('测试2 可选到祖辈（奶奶）',
    D().querySelector('#altBody .choice[data-role="奶奶"]').classList.contains('selected'));
  check('测试2 选择后下一步可用', q('#nextBtn').disabled === false);
  check('测试2 关系条同步', (q('.rel-strip')||{textContent:''}).textContent.indexOf('奶奶') >= 0,
    (q('.rel-strip')||{textContent:''}).textContent);

  /* ---------- 测试3：我的长辈 → 祖辈优先 ---------- */
  clearSession();
  setSession({ target:'family', operator:'孙子', beneficiary:'', confirmed:false, profile:{} });
  await load('/family.html');
  await sleep(700);
  var main3 = qa('#beneficiaryGrid .choice').map(function(b){ return b.dataset.role; });
  var alt3 = qa('#altBody .choice').map(function(b){ return b.dataset.role; });
  check('测试3 我的长辈：主区不含父母',
    main3.indexOf('父亲') < 0 && main3.indexOf('母亲') < 0, main3.join(','));
  check('测试3 我的长辈：主区显示祖辈/配偶/其他',
    ['爷爷','奶奶','外公','外婆','配偶','其他'].every(function(r){ return main3.indexOf(r) >= 0; }),
    main3.join(','));
  check('测试3 父母收进「其他关系」',
    alt3.length === 2 && alt3.indexOf('父亲') >= 0 && alt3.indexOf('母亲') >= 0, alt3.join(','));
  var tip3 = q('#beneficiaryTip').textContent;
  check('测试3 提示文案随入口变化', /祖辈|配偶/.test(tip3), tip3);
  check('测试3 可正常选中祖辈', (function(){
    q('#beneficiaryGrid .choice[data-role="爷爷"]').click();
    return q('#beneficiaryGrid .choice[data-role="爷爷"]').classList.contains('selected');
  })());

  /* ---------- 测试4：详情页返回 → 回上一页 ---------- */
  clearSession();
  setSession({ target:'parents', operator:'女儿', beneficiary:'父亲', confirmed:true,
               text:'我父亲72岁，一个人在广州生活，最近行动不方便。',
               profile:{}, demo:false, demoBanner:false });
  await load('/discover.html');
  var gotCards = await waitFor(function(){ return q('.result-card'); }, 20000, '结果卡');
  check('测试4 结果列表已渲染', gotCards);

  // 点第一张卡进详情。
  // 注意：无头模式下 iframe 的 f.src 不会及时刷新，不能用它判断是否已导航；
  // 改用 iframe 的 load 事件（第五阶段 e2e 已验证的可靠写法）。
  var cardId = q('.result-card').dataset.id;
  q('.result-card').click();
  var nav1 = await waitForEvent(15000);
  check('测试4 已进入政策详情', nav1);
  await waitFor(function(){ return q('.trust-card'); }, 15000, '详情内容');
  check('测试4 详情页内容已加载', !!q('.trust-card'));
  check('测试4 详情页有返回按钮', !!q('.back-link'),
    'href=' + (q('.back-link') ? q('.back-link').getAttribute('href') : 'null'));

  // 点返回：应回到发现页（上一页），而不是首页
  q('.back-link').click();
  var nav2 = await waitForEvent(15000);
  check('测试4 返回后确实导航回上一页', nav2);
  await waitFor(function(){ return q('.result-card'); }, 20000, '返回后的结果列表');
  // 判定落在哪一页：结果卡只在 discover/self 页出现
  check('测试4 返回后回到发现页（而非首页）', qa('.result-card').length > 0);
  check('测试4 返回后确认台仍在（同一页状态保持）', !!q('.board'));

  /* ---------- 测试5：详情返回 → 恢复滚动位置 ---------- */
  var list = qa('.result-card');
  check('测试5 结果列表仍完整', list.length >= 5, 'n=' + list.length);
  // 滚到第 5 张卡附近
  var target = list[Math.min(4, list.length - 1)];
  var pid = target.dataset.id;
  target.scrollIntoView({ block:'center' });
  await sleep(500);
  var yBefore = Wn().scrollY || Wn().pageYOffset || 0;
  check('测试5 已滚动到中部', yBefore > 200, 'scrollY=' + Math.round(yBefore));

  // 进详情
  target.click();
  var nav3 = await waitForEvent(15000);
  check('测试5 已进入详情页', nav3);
  await waitFor(function(){ return q('.trust-card'); }, 15000, '详情内容');
  // 无头模式下 iframe.src 不刷新，改用详情页正文里的政策名反查：
  // 页面上出现的就是所点那条政策，说明跳转与 id 都正确
  var detailName = (q('.card h2') || {textContent:''}).textContent;
  var cardName = null;
  var allNames = list.map(function (c) {
    return { id:c.dataset.id, name:(c.querySelector('.result-name')||{textContent:''}).textContent };
  });
  allNames.forEach(function (x) { if (x.id === pid) cardName = x.name; });
  check('测试5 详情页展示的就是所点那条政策',
    !!cardName && detailName.trim() === String(cardName).trim(),
    '详情=' + detailName + ' 期望=' + cardName + ' id=' + pid);

  // 返回
  var backEl = q('.back-link');
  check('测试5 详情页有返回按钮', !!backEl);
  backEl.click();
  var nav4 = await waitForEvent(15000);
  await waitFor(function(){ return q('.result-card'); }, 20000, '返回后的结果列表');
  await sleep(900);
  var yAfter = Wn().scrollY || Wn().pageYOffset || 0;
  check('测试5 返回后恢复到原滚动位置', Math.abs(yAfter - yBefore) < 160,
    'before=' + Math.round(yBefore) + ' after=' + Math.round(yAfter));
  var hl = qa('.result-card.is-just-viewed');
  check('测试5 刚查看的政策有短暂视觉提示',
    hl.length > 0 && hl.some(function(c){ return c.dataset.id === pid; }),
    'hl=' + hl.map(function(c){ return c.dataset.id; }).join(','));

  // 补充信息的滚动保持逻辑未被破坏（上一阶段修好的）
  var cond = q('[data-confirm="hukou"][data-value="true"]');
  check('测试5 补充信息三值按钮仍在', !!cond);
  if (cond) {
    // 先滚到中部再点，验证不会跳顶
    q('.result-card').scrollIntoView({ block:'center' });
    await sleep(400);
    var y0 = Wn().scrollY;
    cond.click();
    await sleep(2200);
    var y1 = Wn().scrollY;
    check('测试5 补充信息后不跳顶', Math.abs(y1 - y0) < 220,
      'y0=' + Math.round(y0) + ' y1=' + Math.round(y1));
  }

  /* ---------- 测试6：绿智共生不抢视觉层级 ---------- */
  await load('/index.html');
  await sleep(600);
  var d6 = D();
  var hello6 = d6.querySelector('.home-hello');
  var foot = d6.querySelector('.theme-foot');
  var h1s = hello6 ? parseFloat(getComputedStyle(hello6).fontSize) : 0;
  var footSize = foot ? parseFloat(getComputedStyle(foot).fontSize) : 0;
  /* 断言校准说明（2026-10-20 首页重设计）：原断言为 hero 32px 时代的「2 倍」阈值；
     重设计后欢迎标题按展示板规范为 20px，2 倍阈值不再适用。为不降低「绿智共生
     弱化」的标准，改为三重收紧条件：标题 ≥18px 下限 + 页脚 ≤12px 上限 + 比值 ≥1.5。 */
  check('测试6 欢迎标题显著大于「绿智共生」（≥1.5 倍且页脚≤12px 且标题≥18px）',
    h1s > footSize * 1.5 && footSize <= 12 && h1s >= 18,
    h1s + ' vs ' + footSize);
  var footColor = foot ? getComputedStyle(foot).color : '';
  check('测试6 绿智共生为弱色（非黑非深）', /rgb\((\d+), (\d+), (\d+)\)/.test(footColor), footColor);
  check('测试6 绿智共生不在 topbar/欢迎区内',
    d6.querySelector('.topbar').textContent.indexOf('绿智共生') < 0
    && d6.querySelector('.home-welcome').textContent.indexOf('绿智共生') < 0);
  check('测试6 赛事主题信息未删除', d6.body.textContent.indexOf('绿智共生') >= 0);
  check('测试6 首页仍无横向滚动',
    d6.documentElement.scrollWidth <= d6.documentElement.clientWidth + 1,
    'scrollW=' + d6.documentElement.scrollWidth + ' clientW=' + d6.documentElement.clientWidth);

  /* ---------- 测试7：发现路由优先级（首页重设计新增） ----------
     场景A 双痕迹并存（selfText/selfProfile 与 text/beneficiary 同时存在、
             无 pf_last_match）→ 按兼容规则一律 discover.html；
     场景B/B2 有效 pf_last_match 优先于旧会话痕迹（双向验证）；
     场景C 空会话兜底 → family.html；
     场景D 底部导航「发现」与首页发现动态卡同一路由；
     场景E 「咨询」未开放：不跳转且给出明确提示。 */
  out('--- 测试7 发现路由 ---');
  // A. 双痕迹并存 → discover.html
  await load('/index.html');
  clearSession();
  setSession({ selfText: '我72岁，在广州生活', selfProfile: { mode: 'self', age: 72 },
               text: '我父亲72岁，在广州', profile: {}, beneficiary: '父亲', operator: '女儿' });
  await load('/index.html'); await sleep(400);
  q('#discoverCard').click();
  await waitForEvent(8000);
  check('测试7A 双痕迹并存 → discover.html（兼容规则）',
    page().indexOf('discover.html') >= 0, page());
  // B. 有效 pf_last_match(self) 优先于旧家庭痕迹 → self.html
  await load('/index.html');
  clearSession();
  setSession({ text: '旧的家庭协助痕迹', profile: {}, beneficiary: '父亲',
               pf_last_match: { count: 2, mode: 'self', ts: Date.now() } });
  await load('/index.html'); await sleep(400);
  q('#discoverCard').click();
  await waitForEvent(8000);
  check('测试7B 有效 pf_last_match(self) 优先于旧痕迹 → self.html',
    page().indexOf('self.html') >= 0, page());
  // B2. 反向：pf_last_match(family) 优先于本人旧痕迹 → discover.html
  await load('/index.html');
  clearSession();
  setSession({ selfText: '本人的旧痕迹', selfProfile: { mode: 'self' },
               pf_last_match: { count: 5, mode: 'family', ts: Date.now() } });
  await load('/index.html'); await sleep(400);
  q('#discoverCard').click();
  await waitForEvent(8000);
  check('测试7B2 pf_last_match(family) 优先于本人痕迹 → discover.html',
    page().indexOf('discover.html') >= 0, page());
  // C. 空会话 → family.html
  await load('/index.html');
  clearSession();
  await load('/index.html'); await sleep(400);
  q('#discoverCard').click();
  await waitForEvent(8000);
  check('测试7C 空会话兜底 → family.html', page().indexOf('family.html') >= 0, page());
  // D. 底部导航「发现」与发现动态卡同一路由
  await load('/index.html'); await sleep(400);
  var discTab = q('.tab-item[data-tab="discover"]');
  check('测试7D1 底部导航「发现」存在且未伪装', !!discTab && !discTab.getAttribute('aria-disabled'));
  discTab.click();
  await waitForEvent(8000);
  check('测试7D2 底部导航「发现」路由与发现卡一致 → family.html',
    page().indexOf('family.html') >= 0, page());
  // E. 「咨询」未开放：不跳转且给出明确提示
  await load('/index.html'); await sleep(400);
  q('.tab-item[data-tab="consult"]').click();
  await sleep(400);
  var toastEl = q('#pfToast');
  check('测试7E 咨询 tab 未跳转且提示暂未开放',
    page().indexOf('index.html') >= 0 && !!toastEl && toastEl.hidden === false
      && toastEl.textContent.indexOf('暂未开放') >= 0,
    toastEl ? ('toast=' + toastEl.textContent.slice(0, 30) + ' hidden=' + toastEl.hidden) : 'no toast');

  out('');
  out('=== 390×844 实测：通过 ' + pass + '，失败 ' + fail + ' ===', fail ? 'bad' : 'ok');
}

run().catch(function(e){
  out('ERROR ' + e.message, 'bad');
  out('=== 异常终止：通过 ' + pass + '，失败 ' + (fail+1) + ' ===', 'bad');
});
</script>
</body>
</html>
