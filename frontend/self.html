<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="您为自己查找可能相关的公共服务权益，核对 AI 的理解并查看政策依据。">
  <title>政策找人 · 本人权益发现</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/skins.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>

  <div class="notice">
    本人模式：您正在为自己查找可能相关的公共服务权益。
    信息由您本人提供，结果仍需向主管部门核实。
  </div>

  <!-- 第 1 步：描述发生了什么 -->
  <div class="section">
    <div class="step-lead">
      <span class="step-lead-n">1</span>
      <div>
        <div class="step-lead-t">您最近的生活有什么变化？</div>
        <div class="step-lead-s">用日常的话描述就行，不用记政策名称，也不用填表。</div>
      </div>
    </div>
    <div class="card">
      <div class="field">
        <label for="situation">说一说您自己的情况</label>
        <textarea id="situation" placeholder="用一句话说说您最近发生了什么"></textarea>
      </div>
      <div class="btn-row">
        <button type="button" class="btn ghost" id="fillExample">填入示例</button>
        <button type="button" class="btn" id="discoverBtn">让 AI 读一遍</button>
      </div>
      <p class="hint">
        写得口语一些反而更准：年纪、住哪里、和谁住、身体变化、就医、花费压力，都会影响匹配。
      </p>
    </div>
  </div>

  <!-- 情况确认台 + 结果区：AI 读完由 JS 渲染 -->
  <div id="resultArea"></div>

  <div class="section">
    <div class="btn-row">
      <button type="button" class="btn ghost" onclick="location.href='index.html'">← 返回首页</button>
      <button type="button" class="btn ghost" onclick="location.href='family.html'">改为帮家人查询</button>
    </div>
  </div>

  <div class="footnote">
    全程只做「可能相关」的初步提示，不代表已符合资格；任何结论都需要向主管部门核实。
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  renderTopbar('本人权益发现', 'index.html', '本人模式');
  mountDemoBanner();
  mountFlow(1);
  mountRelationStrip();
  mountBottomNav('discover');

  const session = store.read();
  // 从详情页「回去调整」带回来的政策 id（读完即从地址栏移除）
  const RETURN_PID = consumeReturnParam();

  const input = document.getElementById('situation');
  const area = document.getElementById('resultArea');

  /**
   * A4：记录「被点击的生活事件 chip」——重匹配后用它当滚动恢复的锚点。
   * 监听挂在 #resultArea 上（该元素本身不随 innerHTML 重建，所以监听不会失效），
   * capture 阶段先于 bindSceneChips 的 click 回调执行，拿到的是点击瞬间的状态。
   */
  let sceneTap = null;
  area.addEventListener('click', (e) => {
    const chip = e.target && e.target.closest ? e.target.closest('.scene-chip') : null;
    sceneTap = chip ? {
      scene: chip.dataset.scene,
      wasOn: chip.dataset.on,
      viewportY: chip.getBoundingClientRect().top,
      scrollY: window.scrollY,
    } : null;
  }, true);

  // 「还有一些情况」的展示状态（纯展示层，不参与任何匹配）：
  // 预览名单在一次分析内保持稳定，不因点击某个情况而重新洗牌。
  const OPTIONAL_PREVIEW_COUNT = 6;
  let optionalPreview = null;
  let optionalExpanded = false;

  // 本人模式：称谓用「我」，与被查询对象无关；案例内容随政策库覆盖城市变化
  const selfText = () => demoProfile().selfText;

  document.getElementById('fillExample').addEventListener('click', () => {
    input.value = selfText();
    input.focus();
  });

  document.getElementById('discoverBtn').addEventListener('click', () => {
    runMatch({ scrollToResult: true });
  });

  /** 推荐演示案例卡。文案依赖站点上下文，故在 loadSiteContext 之后再渲染。 */
  function buildCaseBox() {
    const p = demoProfile();
    const caseBox = document.createElement('div');
    caseBox.className = 'case-card';
    caseBox.innerHTML = `
      <div class="case-head">
        <span class="case-badge">推荐演示案例</span>
        <span class="case-title">${escapeHtml(p.title)}</span>
      </div>
      <p class="case-desc">点击后填入这句话，仍需您点「让 AI 读一遍」：<br>「<span class="case-preview"></span>」</p>
      <button type="button" class="case-btn" id="caseBtn">体验案例：${escapeHtml(p.short)}</button>`;
    input.closest('.card').insertAdjacentElement('afterend', caseBox);
    caseBox.querySelector('.case-preview').textContent = selfText();
    caseBox.querySelector('#caseBtn').addEventListener('click', () => {
      input.value = selfText();
      // 演示案例是一次全新场景：清掉上一轮留存的事实答案，避免沿用旧画像里的地区等字段
      store.write({ selfProfile: {}, selfText: '' });
      showToast('已填入案例，点「让 AI 读一遍」继续');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // 城市相关文案等站点上下文就绪后再落笔；接口不可用时用默认值，页面照常可用。
  loadSiteContext().then(() => {
    input.placeholder = '例如：' + selfText();
    buildCaseBox();
  });

  if (session.selfText) input.value = session.selfText;

  /**
   * 匹配并渲染。与 discover.html 同一套规则，仅称谓与存储键不同。
   * opts.restore        {key, value, viewportY} 重渲染后把被点击的按钮放回原视口位置
   * opts.scrollToResult true 时渲染后滚动到确认台
   */
  async function runMatch(opts) {
    opts = opts || {};
    const requestId = beginMatchRequest();
    // 注意：这里**不** await loadSiteContext()。
    // 站点上下文在页面加载时就已开始请求，等两次匹配请求回来时必然已就绪；
    // 若在此 await，会额外推迟渲染，导致详情页返回后的滚动位置恢复错过重试窗口。
    const text = input.value.trim();
    if (!text) {
      area.innerHTML = '<div class="notice warn">请先用一句话描述您最近的生活变化。</div>';
      return;
    }
    const isRefresh = !!opts.keepHeight;

    // 局部刷新：结果区仍显示上一次内容，用固定窄条说明「已收到输入、正在更新」
    // 首次匹配：走 AI 流程（renderAiFlow），每一步都对应一次真实请求
    if (isRefresh) showRefreshBar(opts.busyTitle);
    else area.innerHTML = renderAiFlow(0);

    const saved = store.read();
    let data;
    try {
      if (!isRefresh) {
        // 第 1 步：真实调用画像接口，返回后才打勾前两步
        await API.post('/api/profile', { text: text, mode: 'self' });
        if (!isLatestMatchRequest(requestId)) return;
        updateAiFlow(2);
      }
      if (!isLatestMatchRequest(requestId)) return;
      data = await API.match({
        text: text,
        mode: 'self',
        profile: saved.selfProfile || {},
      });
      if (!isLatestMatchRequest(requestId)) return;
      if (!isRefresh) updateAiFlow(4);
    } catch (e) {
      if (!isLatestMatchRequest(requestId)) return;
      area.style.minHeight = '';
      hideRefreshBar();
      if (isRefresh) {
        showToast('更新失败：生活变化已保留，请稍后重试', 2800);
      } else {
        area.innerHTML = '<div class="notice warn">无法连接服务，请确认后端已启动（python backend/server.py）。</div>';
      }
      return;
    }

    store.write({ selfText: text, selfProfile: data.profile });
    mountFlow(2);
    mountRelationStrip();

    // 新一轮分析才重置预览与展开状态；点击某个情况触发的局部刷新沿用原状态。
    if (!isRefresh) {
      optionalPreview = null;
      optionalExpanded = false;
    }
    const optionalNames = optionalScenesOf(data.profile, data.scene_library).map((x) => x.name);
    optionalPreview = optionalPreview
      ? optionalPreview.filter((n) => optionalNames.indexOf(n) >= 0)
      : optionalNames.slice(0, OPTIONAL_PREVIEW_COUNT);

    // 局部刷新时锁定容器高度，保证替换前后文档总高度不变，避免跳顶
    if (isRefresh) area.style.minHeight = area.offsetHeight + 'px';

    area.innerHTML =
      renderSituationBoard(data.profile, data.scene_library, {
        title: '第二步：确认 AI 的理解对不对',
        optionalPreview: optionalPreview,
        optionalExpanded: optionalExpanded,
      }) +
      renderResultCards(data, {
        heading: '第三步：AI 发现 ' + (data.results || []).length + ' 项可能相关的公共服务权益',
      });

    bindAll(data);

    // 首页「发现动态」数据源：仅在匹配成功且结果正常渲染后写入（覆盖写=最近一次真实结果；
    // 上方任何请求失败都会提前 return，不会覆盖旧记录）
    store.write({ pf_last_match: { count: (data.results || []).length, mode: 'self', ts: Date.now() } });

    // 从政策详情返回时，恢复进入详情前的滚动位置并高亮刚看过的政策。
    // 只在有有效记录时执行，不影响正常的补充信息局部刷新。
    if (opts.restorePosition && !RETURN_PID) restoreListPosition();

    // 带着「刚才查看的那条政策」返回：在新结果里重新定位（与家庭模式同一套）
    const returnTookOver = applyReturnPolicy(data.results, {
      pid: RETURN_PID, scroll: !!isRefresh,
    });

    if (isRefresh) showToast('已根据您的确认重新匹配');
    hideRefreshBar();

    if (!returnTookOver) {
      if (opts.restore) restorePosition(opts.restore);
      else if (opts.scrollToResult) {
        const anchor = area.firstElementChild;
        if (anchor) {
          window.scrollTo({
            top: Math.max(0, anchor.getBoundingClientRect().top + window.scrollY - 12),
            behavior: 'smooth',
          });
        }
      }
    }

    if (isRefresh) {
      requestAnimationFrame(() => {
        area.style.minHeight = '';
        if (opts.restore && !returnTookOver) restorePosition(opts.restore);
      });
    }
  }

  /**
   * 局部刷新后把页面放回点击前的位置，避免跳顶。
   * chip 会在「已识别 / 可选」两组之间移动，因此不以它为绝对锚点；
   * 关键条件按钮位置不动，仍锚定它自己的视口位置。
   * A4：在 scrollY 基准之上，若能确认本次点击的 chip 就是重渲染后的同一个元素、
   * 状态确实变了且仍可见，再按它自身的视口位移做相对补偿。
   */
  function sceneChipAnchor(restore) {
    const sel = '.scene-chip[data-scene="' + CSS.escape(String(restore.scene)) + '"]';
    const all = document.querySelectorAll(sel);
    if (all.length !== 1) return null;                      // 1) 身份不唯一 → 不猜
    const chip = all[0];
    if (chip.dataset.on === restore.wasOn) return null;     // 2) 状态没翻转 → 不是本次重渲染的结果
    if (chip.getBoundingClientRect().height <= 0) return null; // 3) 不可见
    const extra = chip.closest('[data-scene-extra]');
    if (extra && (extra.hasAttribute('hidden') || extra.getBoundingClientRect().height <= 0)) {
      return null;                                          // 3) 落在收起的折叠区里
    }
    // 4) 点击时的视口纵坐标要真的在视口内（底部留出 tabbar 高度）
    if (!(restore.viewportY >= 0 && restore.viewportY <= window.innerHeight - 56)) return null;
    return chip;
  }

  function restorePosition(restore) {
    if (restore && typeof restore.scrollY === 'number') {
      // A4：相对补偿。用当前滚动量做基准而不是设绝对位置——本函数会被调用两次
      //（runMatch 里同步一次、rAF 里再清掉 minHeight 后一次），
      // 第二次算出的 delta 约为 0，天然幂等，不会把第一次的补偿抵消掉。
      if (restore.scene && typeof restore.viewportY === 'number') {
        const chip = sceneChipAnchor(restore);
        if (chip) {
          const delta = chip.getBoundingClientRect().top - restore.viewportY;
          window.scrollTo(0, Math.max(0, window.scrollY + delta));
          return;
        }
      }
      window.scrollTo(0, restore.scrollY);
      return;
    }
    if (!restore || !restore.key) return;
    const sel = '[data-confirm="' + restore.key + '"][data-value="' + restore.value + '"]';
    const el = document.querySelector(sel);
    if (!el || el.getBoundingClientRect().height === 0) return;
    const top = el.getBoundingClientRect().top + window.scrollY - restore.viewportY;
    window.scrollTo(0, Math.max(0, top));
  }

  function bindCards() {
    document.querySelectorAll('.result-card').forEach((card) => {
      const go = () => {
        // 进入详情前记住当前滚动位置与这条政策 id，返回时恢复
        saveListPosition(card.dataset.id);
        location.href = 'policy.html?id=' + encodeURIComponent(card.dataset.id);
      };
      card.addEventListener('click', go);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });
  }

  function bindConfirm(current) {
    document.querySelectorAll('[data-confirm]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.dataset.confirm;
        const raw = btn.dataset.value;
        const value = raw === 'true' ? true : (raw === 'false' ? false : null);
        const viewportY = btn.getBoundingClientRect().top;
        btn.disabled = true;
        const profile = Object.assign({}, current.profile, { [key]: value });
        store.write({ selfProfile: profile });
        // 进行中提示带上刚确认的是哪一项，让用户知道系统收到了什么。
        // 去掉问句前缀（「您是否具有…」→「…」），避免状态条被撑长。
        const condEl = btn.closest('.board-cond');
        const condText = condEl && condEl.querySelector('.bc-label')
          ? condEl.querySelector('.bc-label').textContent.trim() : '';
        const short = condText.replace(/^(老人|您)是否(具有|参加|属于)?/, '').trim();
        runMatch({
          restore: { key: key, value: raw, viewportY: viewportY },
          keepHeight: true,
          busyTitle: short ? '已记录「' + short + '」的确认' : '已记录您的确认',
        });
      });
    });
  }

  function bindScenes(current) {
    bindSceneChips(current, function (scenes) {
      // 点击瞬间记下滚动位置：chip 会在两组之间移动，锚定它本身会把页面拽走。
      const tap = sceneTap;
      const scrollY = tap ? tap.scrollY : window.scrollY;
      // scenes_edited 标记用户的纠正，重匹配时不被后端丢弃
      const profile = Object.assign({}, current.profile, {
        scenes: scenes,
        confirmed_scenes: scenes,
        scenes_edited: true,
      });
      store.write({ selfProfile: profile });
      runMatch({
        // A4：带上被点 chip 的身份 / 点击前状态 / 点击时视口位置，
        // 由 restorePosition 逐条校验后再决定是否补偿；没有记录时只带 scrollY。
        restore: tap
          ? { scrollY: scrollY, scene: tap.scene, wasOn: tap.wasOn, viewportY: tap.viewportY }
          : { scrollY: scrollY },
        keepHeight: true,
        busyTitle: '已按您调整的生活变化重新匹配',
      });
      sceneTap = null;   // 一次点击只消费一次，避免残留记录影响后续恢复
    });
  }

  function bindEvidence(current) {
    const map = {};
    (current.results || []).forEach((r) => {
      r.__selfMode = true;
      map[r.policy_id] = r;
    });
    bindEvidenceToggles(map);
  }

  function bindAll(data) {
    bindCards();
    bindConfirm(data);
    bindScenes(data);
    bindEvidence(data);
    bindResultGroups();
    bindSceneMoreToggle(function (open) { optionalExpanded = open; });
  }

  // 从详情页「回去调整」带 focus 参数回来时的定位
  function applyFocus() {
    const f = query('focus');
    if (!f) return;
    let el = null;
    if (f === 'scene') el = document.querySelector('.scene-chips');
    if (f === 'cond') el = document.querySelector('.board-conds');
    if (!el) return;
    setTimeout(() => {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      showToast(f === 'scene' ? '在这里增减生活变化' : '在这里补充关键条件');
    }, 260);
  }

  // 已有输入则自动跑一次，方便从详情页返回。
  // restorePosition 只在真的有返回记录时才恢复滚动；
  // 带 focus 参数时（从详情页「回去调整」过来）优先按区块定位。
  if (session.selfText) {
    runMatch({ restorePosition: !query('focus') }).then(applyFocus);
  }
</script>
</body>
</html>
