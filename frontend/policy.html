<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="查看政策依据、适用条件、官方来源与办理方式，并决定下一步怎么核实。">
  <title>政策找人 · 政策依据</title>
  <link rel="stylesheet" href="assets/tcb.css">
<link rel="stylesheet" href="assets/pf-services-tcb.css">
<script src="assets/pf-service-v3-activation.js"></script>
<link rel="stylesheet" href="assets/navigation.css"><script src="assets/navigation-policy.js"></script><link rel="stylesheet" href="assets/result-v1.css"><script src="assets/policy-actions.js"></script>
<script>
  if (new URLSearchParams(location.search).has('analysis')) {
    for (const file of ['household-analysis.css','v32-discovery.css']) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'assets/' + file;
      document.head.append(link);
    }
  }
</script>
<link rel="stylesheet" href="assets/ui-foundation.css">
<link rel="stylesheet" href="assets/policy-detail-polish.css">
</head>
<body class="detail-v1 policy-detail">
<div class="app">
  <div class="topbar"></div>
  <main id="content">
    <div class="loading">正在加载政策依据…</div>
  </main>
  <div class="footnote">
    政策内容以主管部门公开发布的文件为准。页面仅提示可能相关的权益，不代表已符合资格。
  </div>
</div>

<script src="assets/app.js"></script><script src="assets/followup-client.js"></script>
<script src="assets/tcb-ui.js"></script>
<script src="assets/pf-ns.js"></script>
<script src="assets/pf-services.js"></script>
<script src="assets/followup-service.js"></script>
<script>
  // 顶部返回的父页面必须「同步」确定，不能等异步接口回来再补。
  // 之前这里先写死 index.html，再由 updateTopbarParent() 在接口返回后补登记成
  // discover.html / self.html。实测复现：在接口返回前点顶部返回，会被带回首页，
  // 而不是回到发现权益（本人模式同理，会丢掉「我的发现结果」）。
  // selfMode 只依赖本地会话，可以同步读出，所以这里一次性给对。
  // 顶部返回父页同样按统一模式判定（activeQueryMode），避免本人查询后仍回家庭发现页
  const _navSelf = activeQueryMode() === 'self';
  const _requestedParent = new URLSearchParams(location.search).get('from');
  const _policyParent = PFNavigation.returnTarget('discovery-c.html');
  const analysisParams = new URLSearchParams(location.search);
  const analysisDetail = analysisParams.has('analysis');
  // 进度由主流程条第 3 步高亮承担，顶部不再重复
  if (!analysisDetail) {
    renderTopbar('政策依据', _policyParent);
    compactPolicyHeader();
    mountDemoBanner();
    mountFlow(3);
    mountRelationStrip();
  }
  // 2026-10-30：本页原来没有主导航。详情页属于「发现 → 结果」这条线，
  // 因此高亮「发现」；has-tabbar 的底部预留保证页尾确认区与操作按钮
  // 不被固定导航压住。
  if (!analysisDetail) mountBottomNav();

  const id = query('id');
  const content = document.getElementById('content');

  function compactPolicyHeader() {
    const topbar = document.querySelector('.topbar');
    if (!topbar) return;
    // Keep the rendered link node so its href, data-back, and listeners survive
    // both the app.js header and the tcb-ui.js header adapter.
    const back = topbar.querySelector('[data-back]') || topbar.querySelector('.back-link');
    const row = document.createElement('div');
    row.className = 'brand-row has-back detail-topbar-row';
    if (back) {
      back.textContent = '返回上页';
      row.append(back);
    }
    const brand = document.createElement('span');
    brand.className = 'detail-topbar-brand';
    brand.textContent = '政策找人 · 政策依据';
    row.append(brand);
    topbar.replaceChildren(row);
  }

  // Only split the existing prose at sentence boundaries; do not summarize policy content.
  function policyProse(value) {
    return String(value || '').split(/\n+/).filter(text => text.trim()).flatMap(paragraph => {
      if (paragraph.length < 150) return [paragraph];
      const sentences = paragraph.match(/[^。！？]*[。！？]+|[^。！？]+$/g) || [paragraph];
      const groups = [];
      let current = '';
      for (const sentence of sentences) {
        current += sentence;
        if (current.length >= 90) { groups.push(current); current = ''; }
      }
      if (current) groups.push(current);
      return groups;
    }).map(text => '<p>' + escapeHtml(text) + '</p>').join('');
  }

  function policyHero({name, region, category, sourceLabel, pending, validity, saveId}) {
    return `<section class="card policy-overview detail-hero">
      <p class="detail-eyebrow">政策解读</p>
      <h1>${escapeHtml(name)}</h1>
      <p class="detail-region">${escapeHtml([region,category].filter(Boolean).join(' · ') || '地区暂缺')}</p>
      <div class="detail-meta"><span class="rp-status ${pending ? 'pending' : ''}">${escapeHtml(sourceLabel)}</span>${validity ? '<span class="detail-validity">目录效力：'+escapeHtml(validity)+'</span>' : ''}</div>
      ${saveId ? `<div class="detail-save-bar"><button type="button" class="dhead-save detail-save-control" data-save="${escapeHtml(saveId)}" aria-label="收藏这条政策" aria-pressed="false">收藏政策</button><p class="detail-save-context" data-save-context aria-live="polite">按成员保存，方便下次查看</p></div>` : ''}
    </section>`;
  }

  async function loadAnalysisDetail() {
    const member = analysisParams.get('member');
    const parameters = new URLSearchParams({id:analysisParams.get('analysis'),memberId:member});
    document.body.className = 'v32-flow policy-detail';
    document.body.innerHTML = `<div class="app"><header class="topbar"></header>
      <main id="v32-detail"><p class="loading" role="status">正在读取政策依据…</p></main>
      <p class="footnote">政策内容以主管部门公开发布的文件为准。页面仅提示可能相关的权益，不代表已符合资格。</p></div>`;
    renderTopbar('政策依据', _policyParent);
    compactPolicyHeader();
    PFNavigation.mount();
    const target = document.getElementById('v32-detail');
    try {
      const [stateResponse, versionsResponse, policy] = await Promise.all([
        fetch('/api/followup/v32/state?' + parameters),
        fetch('/api/followup/v32/versions?' + parameters),
        API.policy(id)
      ]);
      if (!stateResponse.ok || !versionsResponse.ok || policy.error) throw Error();
      const [state,{versions}] = await Promise.all([stateResponse.json(),versionsResponse.json()]);
      const version = Number(analysisParams.get('version')) || state.result?.version;
      const snapshot = versions.find(row=>row.version===version);
      const item = snapshot?.policy_candidates.find(row=>row.id===id);
      if (!item) throw Error();
      const recorded = item.policy;
      const src = recorded.source || {};
      let original = '';
      try {
        const url = new URL(src.official_url);
        if (url.protocol === 'https:') original = url.href;
      } catch {}
      const status = {active:'有效',expiring:'临近到期',expired:'已失效',superseded:'已被替代'};
      const validity = status[policy.validity?.status] || '待核实';
      const verified = recorded.verification?.status === 'verified' && original && src.department && (src.document || src.document_no);
      const list = values => values.length ? '<ul>' + values.map(value=>'<li>'+escapeHtml(value)+'</li>').join('') + '</ul>' : '';
      const description = recorded.description || recorded.service_note || '政策简介待核实。';
      const basis = original ? `<a class="tc-link" href="${escapeHtml(original)}" target="_blank" rel="noopener noreferrer"><span>查看官方原文<small>${escapeHtml(new URL(original).hostname)}</small></span></a>` : '<p class="tc-note">原文链接待核实，请向发布部门核实。</p>';
      const backLabel = new URL(_policyParent,location.href).searchParams.has('view') ? '返回原页面' : '返回推荐结果';
      const conditions = item.conditions || [];
      const currentVersion = version === state.result?.version;
      const conditionList = conditions.filter(row=>!row.is_threshold).map(row=>[row.requirement || row.label,row.state === 'unknown' ? '待核实' : row.state === 'failed' ? '条件不满足' : '规则已核验'].join(' · '));
      const missing = (item.missing_information || []).filter(text=>!conditions.some(row=>row.label===text || row.requirement===text));
      const sourceRows = [['责任部门',src.department],['政策文件',src.document],['文号',src.document_no],['生效时间',policy.validity?.effective_from]].filter(row=>row[1]);
      target.innerHTML = `${policyHero({name:item.name,region:recorded.region?.scope || item.region,category:recorded.category || item.category,sourceLabel:verified ? '来源已核验' : '来源待核实',pending:!verified,validity,saveId:currentVersion ? item.id : ''})}
        ${state.demo ? '<p class="demo-note">合成家庭演示 · 使用真实政策和查询流程</p>' : ''}
        <div class="detail-reading">
          ${qBlock(1,'政策简介',policyProse(description))}
          ${qBlock(2,'为什么与你可能相关',policyProse(item.reason)+'<p class="detail-muted">适用资格由主管部门核实。</p>')}
          ${qBlock(3,'适用条件',list(conditionList) || '<p>具体条件请查看政策依据。</p>')}
          ${missing.length ? qBlock(4,'待确认条件',list(missing),'is-warm') : ''}
          ${(recorded.application_process?.length || recorded.materials?.length) ? qBlock(missing.length ? 5 : 4,'办理材料及办理方式',
            (recorded.materials?.length ? '<h4>办理材料</h4>'+list(recorded.materials.map(row=>typeof row==='string' ? row : row.item + (row.to_verify ? ' · 待核实' : ''))) : '')+
            (recorded.application_process?.length ? '<h4>办理方式</h4>'+list(recorded.application_process.map(row=>typeof row==='string' ? row : row.step + (row.to_verify ? ' · 待核实' : ''))) : '')) : ''}
          <section class="trust-card" id="policySource"><h2>政策依据和官方来源</h2><p class="tc-note">${verified ? '政策来源已核验，具体适用条件仍需主管部门确认。' : '来源尚待核实，请以主管部门公开文件为准。'}</p>
            <div class="tc-rows">${sourceRows.map(([key,value])=>'<div class="tc-row"><span class="k">'+escapeHtml(key)+'</span><span class="v">'+escapeHtml(value)+'</span></div>').join('')}</div>${basis}</section>
          <p class="notice warn detail-disclaimer">AI 推荐与政策收录不代表符合申请资格，最终由主管部门核实。</p>
        </div>
        <section class="detail-next-panel"><h2>看完依据，接下来怎么做？</h2><p>${currentVersion ? '可先收藏这项政策，再回到推荐结果继续了解。' : '当前为历史版本，可返回原页面查看查询记录。'}</p><a class="button primary detail-return" href="${escapeHtml(_policyParent)}">${backLabel}</a></section>`;
      if (currentVersion) bindSave({policy_id:item.id,region:{scope:item.region}});
    } catch {
      target.innerHTML = '<p role="status">暂时无法读取这次查询的政策依据，请返回后重试。</p>';
    }
  }

  // 后端在字段缺失时写的是字符串 to_verify，展示层统一当作「没有」
  function clean(v) {
    const s = String(v == null ? '' : v).trim();
    return (!s || s === 'to_verify') ? '' : s;
  }

  // 详情页统一分块
  function qBlock(n, title, inner, cls) {
    return `<div class="detail-block ${cls || ''}" id="q${n}">
      <h2><span class="q-num">${n}</span><span class="q-title">${escapeHtml(title)}</span></h2>
      ${inner}
    </div>`;
  }

  // 首页「政策解读 / 办理指引」入口带来的聚焦意图（?svc=detail|guide）：
  // 滚动到并高亮对应区块——解读看政策简介与适用对象（q1/q2），
  // 办理看材料、办理方式与官方来源（q6/policySource）。参数随 URL 保留，刷新后高亮仍在；
  // 直接打开（无参数）或参数异常时什么都不做，行为与从前完全一致。
  function applySvcFocus() {
    const svc = query('svc');
    const map = { detail: ['q1', 'q2'], guide: ['q6', 'policySource'] };
    const ids = map[svc];
    if (!ids) return;
    const blocks = ids.map((x) => document.getElementById(x)).filter(Boolean);
    if (!blocks.length) return;
    blocks.forEach((b) => b.classList.add('svc-focus'));
    setTimeout(() => {
      blocks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
      showToast(svc === 'detail' ? '已定位到「政策解读」内容' : '已定位到「办理指引」内容');
    }, 260);
  }

  async function load() {
    if (!id) {
      content.innerHTML = '<div class="notice warn">缺少政策编号，请返回发现页重新选择。</div>';
      return;
    }

    let detail;
    try {
      detail = await API.policy(id);
    } catch (e) {
      // 本地启动方式见 docs/README.md；不对用户暴露启动命令
      content.innerHTML = '<div class="notice warn">暂时无法连接服务，请稍后重试。</div>';
      return;
    }
    if (detail.error) {
      content.innerHTML = '<div class="notice warn">未找到该政策。</div>';
      return;
    }

    // 当前画像/模式必须来自统一状态管理：activeQueryMode() + activeProfile()
    // 按 lastQuery 标记选择本人/家庭画像。此前用 session.profile || session.selfProfile
    // 简单兜底，本人查询后仍会沿用旧家庭画像重跑匹配（P1-3）。
    const session = store.read();
    const policyParams = new URLSearchParams(location.search);
    const historyId = policyParams.get('query');
    const historical = historyId ? await PFBusiness.history(historyId, null, policyParams.get('member')).catch(() => null) : null;
    const curMode = historical?.mode || (historyId ? null : activeQueryMode());
    const savedProfile = historyId ? historical?.result?.profile : activeProfile();
    const p = detail;
    // 记住当前查看的政策（唯一标识用 policy_id，不用标题）。
    // 之后点「返回调整…」时把这个 id 带回发现权益页，用于重新匹配后重新定位。
    saveReturnPolicy(id, p.policy_name);

    const ver = p.verification || {};
    const pending = ver.status === 'to_verify';
    // 模式判定统一以 curMode 为准（与 activeProfile 同源），不再依赖画像字段
    const selfMode = curMode === 'self';
    // 本人模式下展示文案统一用「您」；家庭模式保持原称谓
    const say = (t) => personalize(t, savedProfile || {});

    // 真实匹配状态：本次访问是从匹配结果点进来的，session 里存着当时的画像。
    // 用同样的输入重跑一次匹配，只为取回 tier / status，绝不在前端自己判断资格。
    let matchRow = null;
    try {
      if (historyId) {
        matchRow = historical?.result?.results.find(row => row.policy_id === id) || null;
      } else if (savedProfile) {
        const m = await API.match({
          text: savedProfile.raw_text || (selfMode ? session.selfText : session.text) || '',
          mode: savedProfile.mode || (selfMode ? 'self' : undefined),
          relation: selfMode ? undefined : session.beneficiary,
          operator: selfMode ? undefined : session.operator,
          profile: savedProfile,
        });
        matchRow = (m.results || []).find((r) => r.policy_id === id) || null;
      }
    } catch (e) { /* 取不到匹配状态不影响详情展示 */ }

    // ① 这是什么？
    const targets = (p.target_people || []).map((x) => `<li>${escapeHtml(x)}</li>`).join('');
    const scenes = (p.life_scenes || []).map((x) => `<span class="chip">${escapeHtml(x)}</span>`).join('');
    const what = `
      <p>${escapeHtml(p.description || '')}</p>
      <p class="q-lead">面向人群</p>
      <ul>${targets || '<li>待核实</li>'}</ul>
      ${scenes ? `<div class="chips">${scenes}</div>` : ''}`;

    // ② 为什么推荐给您 —— 有匹配上下文时展示证据链，没有则给出通用提示
    const noCtx = selfMode
      ? '本条为通用权益提示。返回上一步补充您的具体情况后，这里会显示针对您本人的证据链。'
      : '本条为通用权益提示。返回上一步补充老人的具体情况后，这里会显示针对这位老人的证据链。';
    const why = matchRow && matchRow.evidence
      ? renderEvidenceChain(matchRow.evidence, { selfMode: selfMode })
      : `<p style="color:var(--muted)">${escapeHtml(noCtx)}</p>`;

    // ③ 还需要确认什么
    const missingRaw = filterAnsweredMissing(p.missing_information, savedProfile);
    const missing = missingRaw.map((x) => say(x));
    const needConfirm = missing.length
      ? `
        <p class="q-lead">这些信息 AI 无法替您判断，需要您或受理单位确认后才成立。</p>
        <ul class="missing-list">
          ${missing.map((x) => `
            <li>
              <div class="mi-q">${escapeHtml(x)}</div>
              <div class="mi-why">${escapeHtml(explainMissing(x))}</div>
            </li>`).join('')}
        </ul>`
      : '<p>暂无必须补充的信息，但仍建议向受理单位核实适用口径后再办理。</p>';

    // ④ 去哪里核实（不是「怎么办理」——本平台不代办，只告诉用户去哪问）
    const srcDept = clean((p.source || {}).department);
    const verifyWhere = `
      <div class="where-list">
        <div class="where-row">
          <span class="wr-k">建议咨询</span>
          <span class="wr-v">${escapeHtml(srcDept || '当地主管部门')}</span>
        </div>
        <div class="where-row">
          <span class="wr-k">建议携带</span>
          <span class="wr-v">${selfMode ? '您本人' : '这位长辈'}的身份证件与医保凭证；涉及失能等级的，先完成照护需求或失能等级评估</span>
        </div>
        <div class="where-row">
          <span class="wr-k">建议问清</span>
          <span class="wr-v">本人是否在服务覆盖范围内、申请入口在哪、需要哪些材料、本人适用的具体标准</span>
        </div>
      </div>
      <p class="q-lead" style="margin:12px 0 0;font-size:13px;color:var(--muted)">
        属地街道、镇与社区的服务覆盖范围和申请入口会有差异，最终以受理单位现场或线上告知为准。
      </p>`;

    // ⑤ 办理方式：只展示数据库中已核验的步骤，未核到的不代为编写
    const steps = (p.application_process || []);
    const allUnverified = !steps.length || steps.every((s) => s.to_verify);
    const processHtml = steps.map((s) => {
      const flag = s.to_verify ? ' <span class="badge pending">待核实</span>' : '';
      return `<li>${escapeHtml(s.step)}${flag}</li>`;
    }).join('');
    const processWarn = allUnverified
      ? `<p class="q-lead" style="margin:0 0 8px;color:var(--warn)">
           办理流程尚未核到一手文件原文，本页不代为列出具体步骤。
           请向${escapeHtml(srcDept || '主管部门')}或所在街镇、社区养老服务窗口咨询实际入口。
         </p>` : '';
    const needProcess = `
      ${processWarn}
      ${steps.length
        ? `<ol>${processHtml}</ol>`
        : '<p style="color:var(--muted)">本页未收录办理流程，请以受理单位现场或线上指引为准。</p>'}`;

    // ⑥ 政策来源（浅蓝信任卡）
    const src = p.source || {};
    const rows = [];
    rows.push(['责任部门', clean(src.department), '']);
    rows.push(['政策文件', clean(src.document), '尚未核到一手文件，此处不代为填写']);
    if (clean(src.document_no)) rows.push(['文号', clean(src.document_no), '']);
    if (clean(src.publish_date)) rows.push(['发布时间', clean(src.publish_date), '']);
    if (clean(src.related_document)) rows.push(['相关依据', clean(src.related_document), '']);
    rows.push(['核验状态', pending ? '来源待核验' : ver.status==='verified'?'来源已核验':'来源状态暂缺', '']);
    rows.push(['核验时间', clean(ver.checked_at) || '未提供', '']);

    const rowsHtml = rows.map((r) => {
      const val = r[1] || r[2];
      return `<div class="tc-row">
        <span class="k">${escapeHtml(r[0])}</span>
        <span class="v${r[1] ? '' : ' muted'}">${escapeHtml(val)}</span>
      </div>`;
    }).join('');

    const url = clean(src.official_url);
    const linkHtml = url
      ? `<a class="tc-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">
           <span class="lico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></span><span>查看官方原文<small>${escapeHtml((()=>{try{return new URL(url).hostname;}catch{return url;}})())}</small></span></a>`
      : `<div class="tc-none"><span class="lico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
           <span>官方链接：尚未核到一手文件来源，暂不提供链接，避免指向错误页面。</span></div>`;

    const verBadge = pending
      ? (clean(src.official_url) ? '<span class="badge pending">来源待核验</span>'
                                 : '<span class="badge pending">来源待核验</span>')
      : ver.status==='verified'?'<span class="badge verified">✓ 来源已核验</span>':'<span class="badge">来源状态暂缺</span>';
    const tcStatus = `
      <div class="tc-status">
        ${verBadge}
        <span>${pending
          ? (clean(src.official_url)
             ? '国家政策依据已核验，本地具体服务及预约方式仍待确认。'
             : '这条政策的一手文件尚未核到，以下内容仅供参考。')
          : ver.status==='verified'?'政策名称、对象、服务内容与依据文件已核对。':'来源核验状态暂缺，请向主管部门核实。'}</span>
      </div>`;

    const verNote = clean(ver.note)
      ? `<p class="tc-note">核验说明：${escapeHtml(ver.note)}</p>` : '';

    // 有效期依据（validity.basis）：本体被延期/修改时，依据文件单独列一行，
    // 优先用本次匹配带来的 basis，其次用政策自身静态记录；都没有则不渲染。
    const basisFromMatch = (matchRow && matchRow.validity && matchRow.validity.basis) || null;
    const basisFromDetail = (p && p.validity && p.validity.basis) || null;
    const basis = basisFromMatch || basisFromDetail || null;
    const basisName = clean(basis && basis.document);
    const basisDocNo = clean(basis && basis.document_no);
    const basisDate = clean(basis && basis.published_date);
    const basisUrl = clean(basis && basis.official_url);
    let basisHtml = '';
    if (basisName || basisDocNo) {
      let bHost = '';
      if (basisUrl) {
        try { bHost = new URL(basisUrl).host; } catch (e) { bHost = ''; }
      }
      const basisLink = basisUrl
        ? `<a class="tc-link" href="${escapeHtml(basisUrl)}" target="_blank" rel="noopener">
             <span>查看延期原文${bHost ? `<span class="tc-link-url">${escapeHtml(bHost)}</span>` : ''}</span>
           </a>`
        : '';
      basisHtml = `
        <div class="tc-basis">
          <div class="tc-row">
            <span class="k">有效期依据</span>
            <span class="v">${escapeHtml(basisName || '—')}${basisDocNo ? `（${escapeHtml(basisDocNo)}）` : ''}${basisDate ? `<span class="tc-basis-date"> · ${escapeHtml(basisDate)} 发布</span>` : ''}</span>
          </div>
          ${basisLink}
        </div>`;
    }

    const sourceCard = `
      <div class="trust-card" id="policySource">
        <h2>政策依据和官方来源</h2>
        ${tcStatus}
        <div class="tc-rows">${rowsHtml}</div>
        ${linkHtml}
        ${url ? '<p class="tc-note" id="policySourceFallback">原文打不开时，可记下文件名称和文号，向发布部门核实。</p>' : ''}
        ${basisHtml}
        ${verNote}
      </div>`;

    // 顶部概要：状态徽章用真实匹配结果，不再一律写「可能相关」
    // tier（强相关/可能相关/待确认）与 status 同源派生（policy_engine.assign_tier），
    // 且列表分组标题已用「优先关注」等用户语言表达分层——详情页不再重复展示 tier-strip。
    const statusLine = matchRow
      ? statusBadge(matchRow.status, pending, clean(src.official_url))
      : statusBadge('可能相关', pending, clean(src.official_url));

    const backHref = _policyParent;
    const backLabel = '← 返回原政策列表';

    // 顶部返回保持进入详情时固定的来源；异步画像重算不能改写导航来源。
    // 下方「调整情况」仍指向发现页，以便继续编辑匹配条件。
    updateTopbarParent(_policyParent);

    // v0.9：政策状态提示（时效 / 阈值核对）。
    // 数据取自本次重跑匹配的 matchRow；取不到（画像丢失、政策不在结果里）时保持空白，
    // 不生成任何 DOM —— 政策库全部为 active 且无阈值时，这里必然为空。
    const statusNotes = renderValidityNote(matchRow && matchRow.validity)
      + renderThresholdNote(matchRow && matchRow.threshold_signal);


    const conditionRows=matchRow?.evidence?.policy_conditions||p.conditions?.qualify||[];
    const conditionHTML=conditionRows.length?'<ul>'+conditionRows.map(c=>'<li>'+escapeHtml(c.requirement||c.label||'待核实')+'</li>').join('')+'</ul>':'<p>暂未提供可展示的结构化条件，请参阅下方政策依据。</p>';
    const materials=(p.materials||[]).filter(x=>typeof x==='string'||x?.item);
    const materialHTML=materials.length?'<h3>办理材料</h3><ul>'+materials.map(x=>'<li>'+escapeHtml(typeof x==='string'?x:x.item)+(x.source_ref?'（'+escapeHtml(x.source_ref)+'）':'')+(x.to_verify?'（材料要求待核实）':'')+'</li>').join('')+'</ul>':'';
    content.innerHTML = `
      ${policyHero({name:p.policy_name,region:p.region?.scope,category:p.category,sourceLabel:pending?'来源待核验':ver.status==='verified'?'来源已核验':'来源状态暂缺',pending:pending || ver.status!=='verified',saveId:p.policy_id})}
      <section class="section detail-reading">
        ${qBlock(1,'政策简介',policyProse(p.description||'政策简介暂缺'))}
        ${qBlock(2,'适用对象','<ul>'+(targets||'<li>暂未提供</li>')+'</ul>')}
        ${qBlock(3,'适用条件',conditionHTML)}
        ${qBlock(4,'本次匹配理由',why)}
        ${qBlock(5,'待确认条件',needConfirm,'is-warm')}
        ${(materials.length||steps.length)?qBlock(6,'办理材料及办理方式',materialHTML+(steps.length?needProcess:'')):''}
        ${sourceCard}
        <p class="notice warn detail-disclaimer">政策收录和初步匹配不代表符合申请资格，最终由主管部门核实。</p>
      </section>
      ${PFPolicyActions.render()}
      <section class="section detail-return-section"><button class="btn ghost detail-return" id="returnOriginalList">返回原政策列表</button></section>`;
    document.getElementById('returnOriginalList').onclick=()=>location.assign(_policyParent);
    PFPolicyActions.bind(p);

    bindSave(p);
    mountRelationStrip();
    applySvcFocus();
  }

  async function bindSave(pol) {
    const btn = document.querySelector('[data-save]');
    if (!btn) return;
    const contextNote = document.querySelector('[data-save-context]');
    const pid = String((pol && pol.policy_id) || '').trim();
    const region = pol?.region?.scope;
    btn.disabled = true;
    if (!pid || !region) return;

    const paint = (on) => {
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('aria-label', on ? '取消收藏这条政策' : '收藏这条政策');
      btn.textContent = on ? '已收藏' : '收藏政策';
    };

    try {
      if (!await PFBusiness.enabled()) {
        paint(PFServices.isFavorite(pid));
        btn.title = '旧收藏仅供查看';
        if (contextNote) contextNote.textContent = '历史收藏仅供查看';
        return;
      }
      const params = new URLSearchParams(location.search);
      const planId = params.get('plan'), queryId = params.get('query');
      const requestedMember = params.get('member');
      const context = planId ? await PFBusiness.plan(planId, requestedMember, queryId) :
        queryId ? await PFBusiness.query(queryId, requestedMember) : null;
      const memberId = context?.memberId ?? requestedMember;
      if (!memberId) {
        btn.disabled = true;
        btn.title = '请先在「我的」选择成员，或从成员的查询结果打开。';
        btn.hidden = true;
        if (contextNote) contextNote.textContent = '先选择成员，再保存这项政策';
        const choose = document.createElement('a');
        choose.href = 'services.html';
        choose.textContent = '选择收藏成员';
        choose.className = 'detail-member-link';
        btn.after(choose);
        return;
      }
      let state = await PFBusiness.favorites(memberId, pid, region);
      const refresh = async () => {
        state = await PFBusiness.favorites(state.member.id, pid, region);
        paint(state.favorite.saved);
        btn.title = '收藏对象：' + state.member.name;
        if (contextNote) contextNote.textContent = '收藏对象：' + state.member.name;
      };
      paint(state.favorite.saved);
      btn.title = '收藏对象：' + state.member.name;
      if (contextNote) contextNote.textContent = '收藏对象：' + state.member.name + (state.member.archivedAt ? ' · 已归档，仅供查看' : '');
      btn.disabled = Boolean(state.member.archivedAt);
      window.addEventListener('pageshow', event => {
        if (event.persisted && btn.isConnected && !btn.disabled) refresh().catch(error => showToast(error.message));
      });
      btn.addEventListener('click', async event => {
        event.stopPropagation();
        if (btn.disabled) return;
        btn.disabled = true;
        try {
          const result = await PFBusiness.command('favorite', {memberId:state.member.id, policyId:pid, region,
            saved:!state.favorite.saved, expectedRevision:state.favorite.revision});
          state.favorite = result.favorite;
          paint(state.favorite.saved);
          showToast(state.favorite.saved ? '已收藏，可在「我的服务」里找到' : '已取消收藏');
        } catch (error) {
          if (error.code === 'revision_conflict' || error.code === 'member_archived') {
            await refresh().catch(() => {});
          }
          showToast('收藏操作未确认：' + error.message);
        } finally {
          btn.disabled = Boolean(state.member.archivedAt);
        }
      });
    } catch (error) {
      btn.title = '收藏暂不可读取';
      if (contextNote) contextNote.textContent = '暂时无法读取收藏状态，请稍后重试';
      showToast('收藏暂不可读取：' + error.message);
    }
  }

  /**
   * 第四步「进一步确认」：用户对这条权益做出明确表态。
   * 表单只存在于本地 sessionStorage，不提交任何数据、不代办任何事项。
   */

  /**
   * 「返回调整生活变化 / 返回补充关键条件」的跳转。
   *
   * 语义是「退回发现权益这一层」，因此与顶部返回一致：明确跳到父页面，
   * 用 location.replace 替换当前页，历史栈深度不变——
   * 不会把用户留在详情页，也不会让顶部返回再弹回来。
   *
   * 额外带上 back=<policy_id>：告诉列表页「我刚在看这一条」。
   * 重新匹配后结果顺序可能全变，列表页按 id 重新定位它，
   * 找不到时只提示「暂未继续匹配」，绝不强行跳回旧页面。
   */
  function goBackToList(focus, backHref) {
    const suffix = id ? '&back=' + encodeURIComponent(id) : '';
    location.replace(PFNavigation.withParams(backHref,{focus,back:id||''}));
  }

  if (analysisDetail) loadAnalysisDetail();
  else load();
</script>
<script src="assets/pf-service-v3-page.js"></script>
</body>
</html>
