<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f1">
  <meta name="description" content="查看政策依据、适用条件、官方来源与办理方式，并决定下一步怎么核实。">
  <title>政策找人 · 政策依据</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div id="content">
    <div class="loading">正在加载政策依据…</div>
  </div>
  <div class="footnote">
    政策内容以主管部门公开发布的文件为准。页面仅提示可能相关的权益，不代表已符合资格。
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  // 顶部返回的父页面必须「同步」确定，不能等异步接口回来再补。
  // 之前这里先写死 index.html，再由 updateTopbarParent() 在接口返回后补登记成
  // discover.html / self.html。实测复现：在接口返回前点顶部返回，会被带回首页，
  // 而不是回到发现权益（本人模式同理，会丢掉「我的发现结果」）。
  // selfMode 只依赖本地会话，可以同步读出，所以这里一次性给对。
  const _navSession = store.read();
  const _navProfile = _navSession.profile || _navSession.selfProfile || null;
  const _navSelf = !!(_navProfile && _navProfile.mode === 'self');
  renderTopbar('政策依据', _navSelf ? 'self.html' : 'discover.html', '第 3 步');
  mountDemoBanner();
  mountDemoProgress(4);
  mountFlow(3);
  mountRelationStrip();

  const id = query('id');
  const content = document.getElementById('content');

  // 后端在字段缺失时写的是字符串 to_verify，展示层统一当作「没有」
  function clean(v) {
    const s = String(v == null ? '' : v).trim();
    return (!s || s === 'to_verify') ? '' : s;
  }

  // 详情页统一分块
  function qBlock(n, title, inner, cls) {
    return `<div class="detail-block ${cls || ''}" id="q${n}">
      <h3><span class="q-num">${n}</span><span class="q-title">${escapeHtml(title)}</span></h3>
      ${inner}
    </div>`;
  }

  async function load() {
    if (!id) {
      content.innerHTML = '<div class="notice warn">缺少政策编号，请返回发现页重新选择。</div>';
      return;
    }

    let detail;
    try {
      detail = await API.policy(id);
    } catch (e) {
      content.innerHTML = '<div class="notice warn">无法连接服务，请确认后端已启动。</div>';
      return;
    }
    if (detail.error) {
      content.innerHTML = '<div class="notice warn">未找到该政策。</div>';
      return;
    }

    // 家庭协助模式存 profile，本人模式存 selfProfile
    const session = store.read();
    const savedProfile = session.profile || session.selfProfile || null;
    const p = detail;
    // 记住当前查看的政策（唯一标识用 policy_id，不用标题）。
    // 之后点「回去调整…」时把这个 id 带回发现权益页，用于重新匹配后重新定位。
    saveReturnPolicy(id, p.policy_name);

    const ver = p.verification || {};
    const pending = ver.status === 'to_verify';
    const selfMode = !!(savedProfile && savedProfile.mode === 'self');
    // 本人模式下展示文案统一用「您」；家庭模式保持原称谓
    const say = (t) => personalize(t, savedProfile || {});

    // 真实匹配状态：本次访问是从匹配结果点进来的，session 里存着当时的画像。
    // 用同样的输入重跑一次匹配，只为取回 tier / status，绝不在前端自己判断资格。
    let matchRow = null;
    try {
      if (savedProfile) {
        const key = selfMode ? 'selfProfile' : 'profile';
        const m = await API.match({
          text: savedProfile.raw_text || session.text || session.selfText || '',
          mode: savedProfile.mode || (selfMode ? 'self' : undefined),
          relation: selfMode ? undefined : session.beneficiary,
          operator: selfMode ? undefined : session.operator,
          profile: savedProfile,
        });
        matchRow = (m.results || []).find((r) => r.policy_id === id) || null;
      }
    } catch (e) { /* 取不到匹配状态不影响详情展示 */ }

    // ① 这是什么？
    const targets = (p.target_people || []).map((x) => `<li>${escapeHtml(x)}</li>`).join('');
    const scenes = (p.life_scenes || []).map((x) => `<span class="chip">${escapeHtml(x)}</span>`).join('');
    const what = `
      <p>${escapeHtml(p.description || '')}</p>
      <p class="q-lead">面向人群</p>
      <ul>${targets || '<li>待核实</li>'}</ul>
      ${scenes ? `<div class="chips">${scenes}</div>` : ''}`;

    // ② 为什么推荐给您 —— 有匹配上下文时展示证据链，没有则给出通用提示
    const noCtx = selfMode
      ? '本条为通用权益提示。返回上一步补充您的具体情况后，这里会显示针对您本人的证据链。'
      : '本条为通用权益提示。返回上一步补充老人的具体情况后，这里会显示针对这位老人的证据链。';
    const why = matchRow && matchRow.evidence
      ? renderEvidenceChain(matchRow.evidence, { selfMode: selfMode })
      : `<p style="color:var(--muted)">${escapeHtml(noCtx)}</p>`;

    // ③ 还需要确认什么
    const missingRaw = filterAnsweredMissing(p.missing_information, savedProfile);
    const missing = missingRaw.map((x) => say(x));
    const needConfirm = missing.length
      ? `
        <p class="q-lead">这些信息 AI 无法替您判断，需要您或受理单位确认后才成立。</p>
        <ul class="missing-list">
          ${missing.map((x) => `
            <li>
              <div class="mi-q">${escapeHtml(x)}</div>
              <div class="mi-why">${escapeHtml(explainMissing(x))}</div>
            </li>`).join('')}
        </ul>
        <p class="q-lead" style="margin:10px 0 0">以上不影响本条出现在您的可能相关列表中，
          但会影响最终能否适用。</p>`
      : '<p>暂无必须补充的信息，但仍建议向受理单位核实适用口径后再办理。</p>';

    // ④ 去哪里核实（不是「怎么办理」——本平台不代办，只告诉用户去哪问）
    const srcDept = clean((p.source || {}).department);
    const verifyWhere = `
      <div class="where-list">
        <div class="where-row">
          <span class="wr-k">建议咨询</span>
          <span class="wr-v">${escapeHtml(srcDept || '当地主管部门')}</span>
        </div>
        <div class="where-row">
          <span class="wr-k">建议携带</span>
          <span class="wr-v">${selfMode ? '您本人' : '这位长辈'}的身份证件与医保凭证；涉及失能等级的，先完成照护需求或失能等级评估</span>
        </div>
        <div class="where-row">
          <span class="wr-k">建议问清</span>
          <span class="wr-v">本人是否在服务覆盖范围内、申请入口在哪、需要哪些材料、本人适用的具体标准</span>
        </div>
      </div>
      <p class="q-lead" style="margin:12px 0 0;font-size:13px;color:var(--muted)">
        属地街道、镇与社区的服务覆盖范围和申请入口会有差异，最终以受理单位现场或线上告知为准。
      </p>`;

    // ⑤ 办理方式：只展示数据库中已核验的步骤，未核到的不代为编写
    const steps = (p.application_process || []);
    const allUnverified = !steps.length || steps.every((s) => s.to_verify);
    const processHtml = steps.map((s) => {
      const flag = s.to_verify ? ' <span class="badge pending">待核实</span>' : '';
      return `<li>${escapeHtml(s.step)}${flag}</li>`;
    }).join('');
    const processWarn = allUnverified
      ? `<p class="q-lead" style="margin:0 0 8px;color:var(--warn)">
           办理流程尚未核到一手文件原文，本页不代为列出具体步骤。
           请向${escapeHtml(srcDept || '主管部门')}或所在街镇、社区养老服务窗口咨询实际入口。
         </p>` : '';
    const needProcess = `
      ${processWarn}
      ${steps.length
        ? `<ol>${processHtml}</ol>`
        : '<p style="color:var(--muted)">本页未收录办理流程，请以受理单位现场或线上指引为准。</p>'}
      <p style="margin-top:8px;color:var(--muted);font-size:12.5px">
        所需材料以受理单位现场或线上告知为准，本页不代为列明，避免给您错误信息。
      </p>`;

    // ⑥ 政策来源（浅蓝信任卡）
    const src = p.source || {};
    const rows = [];
    rows.push(['责任部门', clean(src.department), '']);
    rows.push(['政策文件', clean(src.document), '尚未核到一手文件，此处不代为填写']);
    if (clean(src.document_no)) rows.push(['文号', clean(src.document_no), '']);
    if (clean(src.publish_date)) rows.push(['发布时间', clean(src.publish_date), '']);
    if (clean(src.related_document)) rows.push(['相关依据', clean(src.related_document), '']);
    rows.push(['核验状态', pending ? '来源待核验' : '已核验', '']);
    rows.push(['核验时间', clean(ver.checked_at) || '未提供', '']);

    const rowsHtml = rows.map((r) => {
      const val = r[1] || r[2];
      return `<div class="tc-row">
        <span class="k">${escapeHtml(r[0])}</span>
        <span class="v${r[1] ? '' : ' muted'}">${escapeHtml(val)}</span>
      </div>`;
    }).join('');

    const url = clean(src.official_url);
    const linkHtml = url
      ? `<a class="tc-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">
           <span>🔗</span><span>${escapeHtml(url)}</span></a>`
      : `<div class="tc-none"><span>⚠</span>
           <span>官方链接：尚未核到一手文件来源，暂不提供链接，避免指向错误页面。</span></div>`;

    const verBadge = pending
      ? '<span class="badge pending">来源待核验</span>'
      : '<span class="badge verified">✓ 已核验</span>';
    const tcStatus = `
      <div class="tc-status">
        ${verBadge}
        <span>${pending
          ? '这条政策的一手文件尚未核到，以下内容仅供参考，请以主管部门发布的正式信息为准。'
          : '政策名称、对象、服务内容与依据文件已核对。'}</span>
      </div>`;

    const verNote = clean(ver.note)
      ? `<p class="tc-note">核验说明：${escapeHtml(ver.note)}</p>` : '';

    const sourceCard = `
      <div class="trust-card">
        <h3><span class="q-num">6</span><span class="q-title">政策来源</span></h3>
        ${tcStatus}
        <div class="tc-rows">${rowsHtml}</div>
        ${linkHtml}
        ${verNote}
      </div>`;

    // 顶部概要：状态徽章用真实匹配结果，不再一律写「可能相关」
    const statusLine = matchRow
      ? statusBadge(matchRow.status, pending)
      : statusBadge('可能相关', pending);
    const tierLine = matchRow && matchRow.tier
      ? `<div class="tier-strip ${matchRow.tier === '强相关' ? 'tier-strong'
          : (matchRow.tier === '可能相关' ? 'tier-mid' : 'tier-low')}" style="margin-top:10px">
           <span class="ts-name">${escapeHtml(matchRow.tier)}</span>
           <span class="ts-desc">结合您已确认的信息得出</span>
         </div>`
      : '';

    const backHref = selfMode ? 'self.html' : 'discover.html';
    const backLabel = selfMode ? '← 返回我的发现结果' : '← 返回发现结果';

    // 兜底再登记一次：与顶部栏渲染时用的是同一套判定，正常应完全一致；
    // 万一会话在这期间被改写（例如跨标签页），以这里读到的最新结果为准。
    updateTopbarParent(backHref);

    content.innerHTML = `
      <div class="section">
        <div class="card">
          <h2 style="margin:0 0 6px;font-size:17px">${escapeHtml(p.policy_name)}</h2>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
            <span class="chip">${escapeHtml(p.category)}</span>
            <span class="chip plain">${escapeHtml(p.service_type || '')}</span>
            <span class="chip plain">${escapeHtml((p.region || {}).scope || '')}</span>
          </div>
          <div style="margin-top:8px">${statusLine}</div>
          ${tierLine}
          ${p.service_note ? `<p class="hint">${escapeHtml(p.service_note)}</p>` : ''}
        </div>
      </div>

      <div class="section">
        ${qBlock(1, '这是什么？', what)}
        ${qBlock(2, '为什么推荐给您？', why)}
        ${qBlock(3, '还需要确认什么？', needConfirm, 'is-warm')}
        ${qBlock(4, '去哪里核实？', verifyWhere)}
        ${qBlock(5, '怎么办理？', needProcess)}
        ${sourceCard}
        <div class="notice warn">${escapeHtml(p.risk_notice || 'AI仅进行初步匹配，不代表符合资格。')}</div>
      </div>

      <!-- 第 4 步：进一步确认。让流程形成闭环，而不是停在「读完就走」 -->
      <div class="section">
        ${renderFinalStep(p, matchRow, selfMode, backHref, backLabel)}
      </div>

      <div class="section">
        <div class="btn-row">
          <button type="button" class="btn ghost" onclick="location.href='${backHref}'">${backLabel}</button>
          <button type="button" class="btn ghost" onclick="location.href='index.html'">重新选择帮助对象</button>
        </div>
      </div>`;

    bindFinalStep(id, selfMode, backHref);
    mountFlow(4);
    mountRelationStrip();
  }

  /**
   * 第四步「进一步确认」：用户对这条权益做出明确表态。
   * 表单只存在于本地 sessionStorage，不提交任何数据、不代办任何事项。
   */
  function renderFinalStep(p, matchRow, selfMode, backHref, backLabel) {
    const dept = clean((p.source || {}).department) || '当地主管部门';
    const pending = (p.verification || {}).status === 'to_verify';
    const tid = (p.policy_id || '').slice(-3);

    return `
      <div class="final-step">
        <div class="fs-head">
          <span class="fs-n">4</span>
          <div>
            <div class="fs-t">看完依据，接下来怎么做？</div>
            <div class="fs-s">这一步只帮您把思路理清楚，本平台不代办、不代填，也不会替您做决定。</div>
          </div>
        </div>

        <div class="fs-opts" id="fsOpts">
          <button type="button" class="fs-opt" data-fs="verify">
            <span class="fo-t">打算去核实</span>
            <span class="fo-d">已知晓依据，接下来向${escapeHtml(dept)}或所在街镇咨询本人适用情况</span>
          </button>
          <button type="button" class="fs-opt" data-fs="later">
            <span class="fo-t">先记下来</span>
            <span class="fo-d">暂时不办，但先知道还有这项权益存在</span>
          </button>
          <button type="button" class="fs-opt" data-fs="notmatch">
            <span class="fo-t">情况不符，不适用</span>
            <span class="fo-d">我已核实过，这项与当前情况无关</span>
          </button>
        </div>

        <div class="fs-note" id="fsNote" hidden></div>

        <div class="fs-again">
          <p class="fs-again-t">如果发现 AI 理解的情况和实际不符，可以补充或更正后重新匹配：</p>
          <div class="btn-row">
            <button type="button" class="btn ghost" id="fsFixScene">回去调整生活变化</button>
            <button type="button" class="btn ghost" id="fsFixInfo">回去补充关键条件</button>
          </div>
        </div>

        <div class="fs-tail">
          已核实过「${escapeHtml(p.policy_name)}」：<span id="fsMark" class="fs-mark">尚未表态</span>
          <button type="button" class="fs-clear" id="fsClear" hidden>清除</button>
        </div>
        ${pending ? `<p class="fs-pending">提示：这条权益的一手文件尚未核到，建议先向${escapeHtml(dept)}确认是否确有此项服务。</p>` : ''}
      </div>`;
  }

  const FS_TEXT = {
    verify: '好的。带齐证件去咨询时，可以直接报政策名称与文号，请对方确认本人是否在服务覆盖范围内。',
    later: '已记下。这条会一直在这里，等您需要的时候再回来核实，不用现在决定。',
    notmatch: '已记录为不适用。若之后情况有变化，可以随时重新匹配。',
  };

  function fsKey(pid) { return 'pf_fs_' + pid; }

  function bindFinalStep(pid, selfMode, backHref) {
    const KEY = fsKey(pid);
    const opts = document.getElementById('fsOpts');
    const note = document.getElementById('fsNote');
    const mark = document.getElementById('fsMark');
    const clear = document.getElementById('fsClear');
    if (!opts) return;

    function paint(val) {
      opts.querySelectorAll('.fs-opt').forEach((b) => {
        const on = b.dataset.fs === val;
        b.classList.toggle('is-picked', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      if (val) {
        note.hidden = false;
        note.textContent = FS_TEXT[val];
        mark.textContent = { verify: '打算去核实', later: '先记下来', notmatch: '不适用' }[val];
        mark.className = 'fs-mark is-' + val;
        clear.hidden = false;
      } else {
        note.hidden = true;
        mark.textContent = '尚未表态';
        mark.className = 'fs-mark';
        clear.hidden = true;
      }
    }

    let cur = '';
    try { cur = sessionStorage.getItem(KEY) || ''; } catch (e) { cur = ''; }
    paint(cur);

    opts.querySelectorAll('.fs-opt').forEach((b) => {
      b.addEventListener('click', () => {
        const v = b.dataset.fs;
        cur = (cur === v) ? '' : v;
        try {
          if (cur) sessionStorage.setItem(KEY, cur);
          else sessionStorage.removeItem(KEY);
        } catch (e) { /* 隐私模式下忽略 */ }
        paint(cur);
        showToast(cur ? '已记录您的选择' : '已取消');
      });
    });

    if (clear) {
      clear.addEventListener('click', () => {
        cur = '';
        try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
        paint(cur);
        showToast('已清除');
      });
    }

    const fixScene = document.getElementById('fsFixScene');
    if (fixScene) {
      fixScene.addEventListener('click', () => goBackToList('scene', backHref));
    }
    const fixInfo = document.getElementById('fsFixInfo');
    if (fixInfo) {
      fixInfo.addEventListener('click', () => goBackToList('cond', backHref));
    }
  }

  /**
   * 「回去调整生活变化 / 回去补充关键条件」的跳转。
   *
   * 语义是「退回发现权益这一层」，因此与顶部返回一致：明确跳到父页面，
   * 用 location.replace 替换当前页，历史栈深度不变——
   * 不会把用户留在详情页，也不会让顶部返回再弹回来。
   *
   * 额外带上 back=<policy_id>：告诉列表页「我刚在看这一条」。
   * 重新匹配后结果顺序可能全变，列表页按 id 重新定位它，
   * 找不到时只提示「暂未继续匹配」，绝不强行跳回旧页面。
   */
  function goBackToList(focus, backHref) {
    const suffix = id ? '&back=' + encodeURIComponent(id) : '';
    location.replace(backHref + '?focus=' + focus + suffix);
  }

  load();
</script>
</body>
</html>
