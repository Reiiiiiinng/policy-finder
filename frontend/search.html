    <symbol id="icon-meals" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0zm6 9h6m-1-9 3.5-5"/><ellipse cx="19" cy="4.5" rx="2" ry="2.6" transform="rotate(36 19 4.5)"/></symbol>

  </svg>
  <main class="search-shell">
    <header class="search-hero">
      <h1>查政策</h1>
      <p>先查已收录政策，也可主动联网搜索官方信息</p>
    </header>
    <form id="local-form" class="search-form" role="search" aria-label="搜索已收录政策">
      <svg aria-hidden="true"><use href="#icon-search"/></svg>
      <label class="sr-only" for="local-query">已收录政策关键词</label>
      <input id="local-query" type="search" placeholder="搜索政策关键词" maxlength="120" autocomplete="off">
      <button class="submit" type="submit">搜索</button>
    </form>
    <form id="web-form" class="search-form" role="search" aria-label="联网搜索政策" hidden novalidate>
      <svg aria-hidden="true"><use href="#icon-search"/></svg>
      <label class="sr-only" for="web-query">公开政策关键词</label>
      <input id="web-query" type="search" placeholder="输入公开政策关键词" maxlength="120"
             autocomplete="off" required aria-describedby="web-hint">
      <span class="sr-only" id="web-hint">避免填写个人信息。</span>
      <button class="submit" type="submit">搜索</button>
    </form>
    <div class="modes" role="tablist" aria-label="搜索来源">
      <button type="button" role="tab" id="local-tab" aria-selected="true" aria-controls="local">
        <svg aria-hidden="true"><use href="#icon-stack"/></svg>已收录政策
      </button>
      <button type="button" role="tab" id="web-tab" aria-selected="false" aria-controls="web" tabindex="-1">
        <svg aria-hidden="true"><use href="#icon-globe"/></svg>联网搜索
      </button>
    </div>
    <section id="local" role="tabpanel" aria-labelledby="local-tab">
      <div class="feedback" role="status" id="local-status"></div>
      <button type="button" class="retry" id="local-retry" hidden>重试加载</button>
      <div class="results" id="local-results"></div>
    </section>
    <section id="web" role="tabpanel" aria-labelledby="web-tab" hidden>
      <header class="results-heading">
        <h2 id="web-results-title" hidden>搜索结果</h2>
        <div class="feedback" role="status" id="web-status">输入关键词后开始搜索。</div>
        <p class="submitted-query" id="web-submitted-query" hidden></p>
      </header>
      <button type="button" class="retry" id="web-retry" hidden>重试搜索</button>
      <div class="results" id="web-results"></div>
      <p class="search-notice" id="web-notice" hidden><svg aria-hidden="true"><use href="#icon-info"/></svg>联网搜索结果仅供线索参考，请以政府部门最新公布的信息为准。</p>
    </section>
  </main>
</body>
</html>
