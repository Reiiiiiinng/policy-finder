<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政策找人 · AI发现</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>

  <div class="section">
    <h2 class="section-title">说出家人的生活变化</h2>
    <div class="card">
      <div class="field">
        <label for="situation">用一句话描述就好，不用写政策名称</label>
        <textarea id="situation" placeholder="例如：我父亲72岁，一个人在广州生活，最近行动不方便。"></textarea>
      </div>
      <button class="btn ghost" id="fillExample" style="margin-bottom:10px">填入示例</button>
      <button class="btn" id="discoverBtn">开始发现</button>
      <p class="hint">
        可以写得口语一些：年纪、住哪里、和谁住、身体变化、就医情况、照护压力，都会帮助匹配。
      </p>
    </div>

    <!-- 固定演示案例：只填入文本框，仍由您点击「开始发现」，方便答辩展示输入过程 -->
    <div class="case-card">
      <div class="case-head">
        <span class="case-badge">推荐演示案例</span>
        <span class="case-title">72 岁 · 广州 · 独居 · 行动不便</span>
      </div>
      <div class="case-tags">
        <span class="case-tag">72岁广州老人</span>
        <span class="case-tag">独居</span>
        <span class="case-tag">行动不便</span>
      </div>
      <p class="case-desc">
        点击后自动填入下面这句话，仍需您点「开始发现」：<br>「<span id="casePreview"></span>」
      </p>
      <button type="button" class="case-btn" id="caseBtn">体验案例：72岁广州老人</button>
    </div>
  </div>

  <div id="resultArea"></div>

  <div class="footnote">
    匹配结果仅为初步提示，均需进一步确认，不作为资格认定。
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  renderTopbar('AI发现', 'family.html', '初步匹配');
  mountDemoBanner();
  mountDemoProgress(2);

  const session = store.read();
  const EXAMPLE = '我父亲72岁，一个人在广州生活，最近行动不方便。';

  const input = document.getElementById('situation');
  const area = document.getElementById('resultArea');

  // 固定演示案例：称谓跟随家庭页选择的受益人，避免「选了母亲却说父亲」
  const CALL = { '配偶': '老伴' };
  const CASE_WHO = CALL[session.beneficiary] || session.beneficiary || '父亲';
  const CASE_TEXT = '我' + CASE_WHO + '72岁，一个人在广州生活，最近行动不方便。';
  document.getElementById('casePreview').textContent = CASE_TEXT;
  document.getElementById('caseBtn').addEventListener('click', () => {
    input.value = CASE_TEXT;
    input.focus();
    // 演示案例是一次全新场景：清掉上一轮留存的事实答案，
    // 否则后端会沿用旧画像里的地区等字段，导致换城市后仍然匹配不到。
    store.write({ profile: {} });
  });

  document.getElementById('fillExample').addEventListener('click', () => {
    input.value = EXAMPLE;
    input.focus();
  });

  if (session.text) input.value = session.text;

  // 演示模式首次进入：文本已由 session.text 自动填入，但不自动跑匹配，
  // 保留评委手动点「开始发现」以展示输入→分析→结果的过程。
  // 首次进入后清除 demo 标记，之后从详情页返回时照常自动跑。
  if (session.demo) {
    store.write({ demo: false });
  }

  function renderLoading() {
    area.innerHTML = '<div class="loading">正在根据您描述的情况进行初步匹配…</div>';
  }

  /**
   * 匹配并渲染。
   * opts.restore        {key, value, viewportY} 重渲染后把被点击的按钮放回原来的视口位置
   * opts.scrollToResult true 时渲染后滚动到结果区（首次点击「开始发现」用）
   */
  async function runMatch(opts) {
    opts = opts || {};
    const text = input.value.trim();
    if (!text) {
      area.innerHTML = '<div class="notice warn">请先用一句话描述老人最近的生活变化。</div>';
      return;
    }
    const isRefresh = !!opts.restore;   // true = 由「补充信息」触发的局部刷新

    // 局部刷新时不能重建结果区（会把几千 px 的内容换成一行字 → 文档高度骤降 → 跳顶），
    // 只给一个浮层提示「正在处理」。
    if (isRefresh) showToast('已更新，正在重新匹配…');

    // 注意：首次匹配才走 AI 流程展示；局部刷新不重建 DOM，保证滚动位置稳定。
    // renderLoading 会把整个结果区替换成一行文字，文档高度从几千 px 骤降到几十 px，
    // 浏览器会立刻把 scrollTop 夹到新的最大值（≈0），用户就会看到「先跳到顶部、再弹回来」。
    if (!isRefresh) area.innerHTML = renderAiFlow(0);

    const saved = store.read();
    const payload = {
      text,
      relation: saved.beneficiary,
      operator: saved.operator,
      profile: saved.profile || {},
    };

    let data;
    try {
      if (!isRefresh) {
        // 第 1 步：真实调用画像接口。返回后才是真正「已完成」的那两步。
        await API.post('/api/profile', {
          text: text,
          relation: saved.beneficiary,
          operator: saved.operator,
        });
        updateAiFlow(2);
      }
      // 第 2 步：真实调用匹配接口。返回后另外两步才真正完成。
      data = await API.match(payload);
      if (!isRefresh) updateAiFlow(4);
    } catch (e) {
      area.style.minHeight = '';
      area.innerHTML = '<div class="notice warn">无法连接服务，请确认后端已启动（python backend/server.py）。</div>';
      return;
    }

    store.write({ text, profile: data.profile });

    // 局部刷新时先锁定容器当前高度：这样 innerHTML 替换前后的文档总高度保持一致，
    // 浏览器不会把 scrollTop 往上夹，替换瞬间也就不会出现任何可视位移。
    if (isRefresh) area.style.minHeight = area.offsetHeight + 'px';

    // 渲染函数已抽到 assets/app.js，本人模式页 self.html 复用同一套
    area.innerHTML =
      renderProfileCard(data.profile, { title: 'AI 分析依据' }) +
      renderResultCards(data) +
      renderConfirmCard(data.profile);

    bindCards();
    bindConfirm(data);
    bindEmptyActions();
    // 结果出来后，演示进度推进到第 3 步（AI发现可能权益）
    mountDemoProgress(3);

    if (isRefresh) showToast('已根据您的回答重新匹配');

    if (opts.restore) {
      restorePosition(opts.restore);
    } else if (opts.scrollToResult) {
      const anchor = document.getElementById('resultAnchor');
      if (anchor) {
        window.scrollTo({
          top: Math.max(0, anchor.getBoundingClientRect().top + window.scrollY - 12),
          behavior: 'smooth',
        });
      }
    }

    if (isRefresh) {
      // 下一帧布局稳定后再释放高度锁，并做一次位置校正
      requestAnimationFrame(() => {
        area.style.minHeight = '';
        if (opts.restore) restorePosition(opts.restore);
      });
    }
  }

  /** 把某个「是/否/不确定」按钮放回它点击前所在的视口位置 */
  function restorePosition(restore) {
    const sel = '[data-confirm="' + restore.key + '"][data-value="' + restore.value + '"]';
    const el = document.querySelector(sel);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - restore.viewportY;
    window.scrollTo(0, Math.max(0, top));
  }

  function bindCards() {
    document.querySelectorAll('.result-card').forEach((card) => {
      card.addEventListener('click', () => {
        location.href = 'policy.html?id=' + encodeURIComponent(card.dataset.id);
      });
    });
  }

  function bindConfirm(current) {
    document.querySelectorAll('[data-confirm]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.confirm;
        const raw = btn.dataset.value;
        const value = raw === 'true' ? true : (raw === 'false' ? false : null);
        // 记下按钮当前的视口位置，重绘后原样恢复
        const viewportY = btn.getBoundingClientRect().top;
        // 即时反馈：请求处理期间禁用该按钮，避免重复点击
        btn.disabled = true;
        btn.style.opacity = '0.55';
        const profile = Object.assign({}, current.profile, { [key]: value });
        store.write({ profile });
        runMatch({ restore: { key: key, value: raw, viewportY: viewportY } });
      });
    });
  }

  /** 空状态里的两个出口：回去补充描述 / 直接用演示案例 */
  function bindEmptyActions() {
    document.querySelectorAll('[data-empty-act]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.emptyAct === 'edit') {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
          input.focus();
        } else {
          document.getElementById('caseBtn').click();
        }
      });
    });
  }

  document.getElementById('discoverBtn').addEventListener('click', () => runMatch({ scrollToResult: true }));

  // 已输入过则自动跑一次，方便从详情页返回；演示模式首次进入不跑（session.demo 已在上方清除）
  if (session.text && !session.demo) runMatch();
</script>
</body>
</html>
