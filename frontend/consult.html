<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="按主管部门查看正式政策库中的政策与官方依据；本页不提供在线咨询、不代办、不代填。">
  <title>咨询与办理指引 · 政策找人</title>
  <link rel="stylesheet" href="assets/style.css?v=20261030b">
</head>
<body>
<div class="app">
  <div class="topbar"></div>

  <section class="section">
    <div class="card consult-intro">
      <h2 class="consult-title">咨询与办理指引</h2>
      <p class="consult-sub">把「去哪问、问什么」整理好，具体答复由主管部门给出。</p>
      <ul class="consult-rules">
        <li>本页<b>不提供在线咨询、不代办、不代填</b>；部门、政策名称与官方链接读取自正式政策库，不补造信息。</li>
      </ul>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">咨询时建议问清这四件事</h2>
    <div class="card">
      <div class="where-list">
        <div class="where-row"><span class="wr-k">① 覆盖范围</span><span class="wr-v">本人是否在服务覆盖范围内；街道、镇与社区可能有差异。</span></div>
        <div class="where-row"><span class="wr-k">② 申请入口</span><span class="wr-v">线上申请入口在哪里，或应去哪个线下窗口。</span></div>
        <div class="where-row"><span class="wr-k">③ 所需材料</span><span class="wr-v">需要哪些证件与凭证，是否要先完成评估。</span></div>
        <div class="where-row"><span class="wr-k">④ 适用标准</span><span class="wr-v">本人适用的具体标准与发放方式是什么。</span></div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">按主管部门查看</h2>
    <div id="consultDepts" aria-live="polite">
      <div class="notice" role="status">正在读取正式政策库…</div>
    </div>
  </section>

  <div class="footnote">
    <span id="footScope">数据范围：正式政策库</span><br>
    <span>本页仅为核实指引，不构成政策解释或资格认定；最终以主管部门答复为准。</span>
  </div>
</div>

<script src="assets/app.js?v=20261030b"></script>
<script>
  renderTopbar('咨询与办理指引', 'index.html', '官方渠道');
  mountBottomNav('consult');

  (async function loadConsultDirectory() {
    const box = document.getElementById('consultDepts');
    try {
      const brief = await API.get('/api/policies');
      const policies = brief && Array.isArray(brief.policies) ? brief.policies : [];
      if (!policies.length) {
        box.innerHTML = renderConsultDirectory([], 0);
        return;
      }

      const settled = await Promise.allSettled(policies.map((policy) => {
        const id = policy && policy.policy_id;
        return id ? API.policy(id) : Promise.reject(new Error('missing policy_id'));
      }));
      const details = [];
      let failed = 0;
      settled.forEach((result) => {
        const detail = result.status === 'fulfilled' ? result.value : null;
        if (detail && !detail.error && detail.policy_id && detail.policy_name) {
          details.push(detail);
        } else {
          failed += 1;
        }
      });
      box.innerHTML = renderConsultDirectory(details, failed);
    } catch (e) {
      box.innerHTML = '<div class="notice warn consult-empty" role="alert">暂时无法读取政策数据，未展示部门或官方链接。请稍后刷新重试。</div>';
    }
  })();

  loadSiteContext().then(() => {
    const scope = document.getElementById('footScope');
    if (scope) {
      scope.textContent = '数据范围：' + SITE.region + '公共服务政策数据（逐条标注责任部门与来源核验状态）';
    }
  });
</script>
</body>
</html>
