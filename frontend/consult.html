<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f1">
  <meta name="description" content="按主管部门查看咨询渠道与出门前的准备清单。本平台不代办、不做资格认定。">
  <title>咨询 · 政策找人</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>

  <div class="section">
    <div class="card consult-lead">
      <h2 class="cl-t">先问清，再出门</h2>
      <p class="cl-d">
        这里按主管部门列出你可以问的地方，以及去之前该带、该问的东西。
        把该问的问清楚，通常可以少跑一趟。
      </p>
      <div class="notice">
        本平台<strong>未接入在线咨询</strong>，不代办、不代为提交材料，也不做资格认定。
        具体受理以主管部门答复为准。
      </div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">按主管部门</h2>
    <div id="deptList"><p class="hint">正在读取政策库……</p></div>
  </div>

  <div class="section">
    <h2 class="section-title">通用四问</h2>
    <div class="card">
      <p class="hint">不管问哪一项，都建议把这四句话问清楚：</p>
      <ul class="ask-list">
        <li>本人（或这位长辈）在不在服务覆盖范围内？</li>
        <li>申请入口在哪里——窗口、电话还是线上？</li>
        <li>需要准备哪些材料，有没有指定格式？</li>
        <li>适用的具体标准与发放方式是什么？</li>
      </ul>
    </div>
  </div>

  <div class="footnote">
    咨询结论由主管部门给出。本平台只帮您把该问的准备好。
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  renderTopbar('咨询', null);
  mountTabbar('consult');
  mountDemoBanner();

  const listEl = document.getElementById('deptList');

  // 不编热线号码：库里没有电话字段，编一个就是假信息。
  // 这里只聚合真实存在的 source_department，并说明渠道以官方公布为准。
  (async function loadDepts() {
    let d;
    try {
      d = await API.get('/api/policies');
    } catch (e) {
      listEl.innerHTML = '<div class="notice warn">无法连接服务，请确认后端已启动。</div>';
      return;
    }
    const all = (d && d.policies) || [];
    const map = new Map();
    all.forEach((p) => {
      const dept = ((p.source || {}).department) || '主管部门';
      if (!map.has(dept)) map.set(dept, { dept: dept, n: 0, verified: 0 });
      const row = map.get(dept);
      row.n += 1;
      if (!((p.source || {}).pending)) row.verified += 1;
    });
    if (!map.size) {
      listEl.innerHTML = '<p class="hint">政策库里暂时没有可展示的主管部门。</p>';
      return;
    }
    listEl.innerHTML = `<div class="dept-list">${Array.from(map.values()).map((r) => `
      <div class="dept-card">
        <div class="dept-top">
          <span class="dept-name">${escapeHtml(r.dept)}</span>
          <span class="dept-n">${r.n} 条政策</span>
        </div>
        <div class="dept-meta">
          其中 ${r.verified} 条已核验来源，${r.n - r.verified} 条待核验
        </div>
        <p class="dept-how">
          咨询渠道以该部门公布的服务窗口或政务服务热线为准。
          先按上面的四问把问题列好，再打过去。
        </p>
      </div>`).join('')}</div>`;
  })();
</script>
</body>
</html>
