<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="政策找人：说出家人的生活变化，AI 帮您发现可能遗漏的公共服务权益。">
  <meta name="theme-color" content="#f7f5ee">
  <title>政策找人 · 让可能被忽略的权益主动找到需要它的人</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">

  <!-- 顶部品牌条：品牌名弱化，让「政策找人」成为第一视觉层级 -->
  <div class="topbar">
    <div class="brand-row">
      <div class="brand-mark">
        <span class="mark-dot" aria-hidden="true"></span>
        <div>
          <div class="brand-name">政策找人</div>
          <div class="sub">AI 赋能公共服务权益发现</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 模块 A：欢迎区（替代原大标题 hero，控制首屏高度） -->
  <header class="home-welcome animate-in">
    <h1 class="home-hello">您好，欢迎使用政策找人</h1>
    <p class="home-hello-sub">为您主动发现可能相关的政策与服务</p>
  </header>

  <!-- 模块 B：家庭画像卡
       成员与年龄全部来自当前会话真实数据（session.beneficiary / profile.age /
       selfProfile），无任何硬编码；无会话时显示空态引导，不伪造成员。 -->
  <section class="home-profile animate-in d1" id="entry" aria-label="家庭画像">
    <div class="hp-head">
      <span class="hp-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3"></circle>
          <path d="M3.6 19a5.4 5.4 0 0 1 10.8 0"></path>
          <circle cx="17" cy="9.4" r="2.3"></circle>
          <path d="M14.9 19a4.2 4.2 0 0 1 5.5-3.9"></path>
        </svg>
        家庭画像
      </span>
      <span class="hp-count" id="hpCount">正在读取家庭画像…</span>
    </div>
    <div class="hp-title" id="hpTitle">为家人的生活变化，找到可能遗漏的权益</div>
    <div class="hp-members" id="hpMembers">
      <!-- 由底部脚本按会话真实状态渲染：成员卡 / 本人卡 / 空态引导卡 -->
    </div>
    <button type="button" class="hp-enter" id="hpEnter" data-target="parents"
            aria-label="进入家庭情况确认，重新评估家庭情况">
      重新评估家庭情况
    </button>
    <button type="button" class="hp-self-link" data-target="self"
            aria-label="进入本人模式，为自己查找可能相关的权益">
      或 <b>为自己查找 ›</b>
    </button>
  </section>

  <!-- 模块 C：发现动态卡
       数量仅来自最近一次真实匹配记录（pf_last_match，由发现页写入并校验），
       无记录 / 过期 / 非法一律空态，绝不显示「新增」或写死数字。 -->
  <button type="button" class="home-discover animate-in d2 is-empty" id="discoverCard"
          aria-label="查看发现动态">
    <span class="dc-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v2M5.6 5.6 7 7M3 12h2M18.4 5.6 17 7M21 12h-2"></path>
        <circle cx="12" cy="14" r="5"></circle>
        <path d="M12 14v-3"></path>
      </svg>
    </span>
    <span class="dc-body">
      <span class="dc-tag">发现动态</span>
      <span class="dc-txt" id="dcTxt">完成一次情况确认后，这里会汇总为您发现的权益</span>
    </span>
    <span class="dc-arrow" aria-hidden="true">›</span>
  </button>

  <!-- 模块 D：服务入口 2×2 宫格
       政策匹配连接真实发现流程；暂无对应功能的入口明确标注「建设中」，
       点击给出说明并引导至现有详情页能力，不伪装成已实现。 -->
  <section class="home-grid-sec animate-in d2" aria-label="服务入口">
    <h2 class="hg-title">服务入口</h2>
    <div class="home-grid">
      <button type="button" class="hg-tile" id="tileMatch">
        <span class="t-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 9h8M8 13h5"></path>
          </svg>
        </span>
        <span class="t-name">政策匹配</span>
        <span class="t-sub">描述情况，AI 帮您匹配</span>
      </button>
      <button type="button" class="hg-tile is-todo" data-todo="解读" aria-disabled="true">
        <span class="t-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2z"></path>
            <path d="M9 8h6M9 12h4"></path>
          </svg>
        </span>
        <span class="t-name">政策解读<span class="t-soon">建设中</span></span>
        <span class="t-sub">依据与解读详见每条权益的详情页</span>
      </button>
      <button type="button" class="hg-tile is-todo" data-todo="办理" aria-disabled="true">
        <span class="t-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"></path>
            <circle cx="12" cy="11" r="2.2"></circle>
          </svg>
        </span>
        <span class="t-name">办理指引<span class="t-soon">建设中</span></span>
        <span class="t-sub">办理流程与官方渠道详见详情页</span>
      </button>
      <button type="button" class="hg-tile is-todo" data-todo="权益" aria-disabled="true">
        <span class="t-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.4"></circle>
            <path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"></path>
          </svg>
        </span>
        <span class="t-name">我的权益<span class="t-soon">规划中</span></span>
        <span class="t-sub">当前可在「发现」查看匹配结果</span>
      </button>
    </div>
  </section>

  <!-- 比赛演示模式入口：预设虚拟案例，走完整流程但不自动提交（原功能保留） -->
  <button type="button" class="demo-entry" id="demoEntry"
          aria-label="进入比赛演示模式，使用预设虚拟案例">
    <span class="demo-entry-body">
      <span class="demo-entry-title">🎬 演示体验</span>
      <span class="demo-entry-desc" id="demoEntryDesc">推荐答辩案例</span>
    </span>
    <span class="demo-entry-arrow" aria-hidden="true">›</span>
  </button>

  <div class="notice animate-in d3">
    本页面由 AI 根据您描述的生活情况进行初步匹配，仅用于提示「可能相关」的公共服务权益，
    不代表已符合政策资格。最终资格由主管部门核定。
  </div>

  <div class="footnote">
    <span id="footScope">数据范围：公共服务政策试点数据</span><br>
    <span id="footSource">政策来源：各主管部门官方公开文件，详见每条政策的「政策来源」区</span><br>
    <span class="theme-foot">参赛主题 · 绿智共生</span>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  // 底部导航：首页为当前页（discover/self 页由各自脚本挂载）
  mountBottomNav('home');

  /* ---------- 模块 B：家庭画像卡渲染（全部读取真实会话数据） ---------- */
  const MEMBER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"></circle><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"></path></svg>';
  const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';

  function memberCardHtml(name, ageText) {
    return '<div class="hp-member is-active">'
      + '<span class="hp-avatar">' + MEMBER_ICON + '</span>'
      + '<span class="nm">' + escapeHtml(name) + '</span>'
      + '<span class="ag">' + escapeHtml(ageText || '') + '</span>'
      + '</div>';
  }

  function renderHomeProfile() {
    const s = store.read();
    const membersEl = document.getElementById('hpMembers');
    const countEl = document.getElementById('hpCount');
    const enterEl = document.getElementById('hpEnter');

    const isSelf = !!(s.selfProfile && s.selfProfile.mode === 'self');
    const ben = s.beneficiary;
    // 年龄只在真实画像给出数字时展示；没有就不显示，绝不编造
    const famAge = (s.profile && typeof s.profile.age === 'number') ? s.profile.age + ' 岁' : '';
    const selfAge = (s.selfProfile && typeof s.selfProfile.age === 'number') ? s.selfProfile.age + ' 岁' : '';

    if (ben) {
      countEl.textContent = '正在为 1 位家庭成员查找';
      membersEl.innerHTML = memberCardHtml(ben, famAge)
        + '<button type="button" class="hp-member is-more" id="hpMore">'
        + '<span class="hp-avatar">' + PLUS_ICON + '</span>'
        + '<span class="nm">更多成员</span><span class="ag">在下一步选择</span></button>';
      document.getElementById('hpMore').addEventListener('click', goFamilyEntry);
    } else if (isSelf) {
      countEl.textContent = '正在为自己查找';
      membersEl.innerHTML = memberCardHtml('本人', selfAge);
    } else {
      countEl.textContent = '尚未建立家庭画像';
      membersEl.innerHTML = '<div class="hp-empty">'
        + '<span class="hp-avatar">' + PLUS_ICON + '</span>'
        + '<span><span class="nm">建立家庭画像</span><br>'
        + '<span class="ag">选择帮谁查 · 确认查询关系 · 一句话描述变化</span></span>'
        + '</div>';
      enterEl.textContent = '开始建立家庭画像';
    }
  }

  /* ---------- 入口分流（沿用旧契约：data-target + session.target） ---------- */
  // 家庭入口：target 沿用上次（parents/family），首次默认 parents；
  // 「我的长辈」语义由 family.html 的「其他关系」折叠区完整承接，跳转契约不变。
  function goFamilyEntry() {
    const prev = store.read().target;
    store.write({ target: (prev === 'family' ? 'family' : 'parents'), demo: false, demoBanner: false });
    location.href = 'family.html';
  }

  document.getElementById('hpEnter').addEventListener('click', goFamilyEntry);
  document.querySelector('.hp-self-link').addEventListener('click', () => {
    store.write({ target: 'self', demo: false, demoBanner: false });
    location.href = 'self.html';
  });

  /* ---------- 模块 C：发现动态卡（只认校验通过的真实匹配记录） ---------- */
  function renderDiscoverCard() {
    const card = document.getElementById('discoverCard');
    const txt = document.getElementById('dcTxt');
    const lm = validLastMatch(store.read());
    if (lm) {
      card.classList.remove('is-empty');
      txt.innerHTML = lm.count === 0
        ? '上次未发现可能相关的权益，点击重新描述情况'
        : '上次发现 <b>' + lm.count + ' 项</b>可能相关的权益，点击查看';
    } else {
      card.classList.add('is-empty');
      txt.textContent = '完成一次情况确认后，这里会汇总为您发现的权益';
    }
  }
  document.getElementById('discoverCard').addEventListener('click', () => {
    location.href = discoverRouteTarget();
  });

  /* ---------- 模块 D：服务宫格 ---------- */
  // 政策匹配：有会话痕迹 → 按统一路由继续；无会话 → family.html（统一路由的兜底）
  document.getElementById('tileMatch').addEventListener('click', () => {
    location.href = discoverRouteTarget();
  });
  // 暂无对应功能的入口：明确提示 + 指引到现有详情页能力，不跳转、不伪装
  const TODO_MSG = {
    '解读': '政策解读建设中：每条权益的「这是什么 / 为什么推荐 / 还需确认什么」已在详情页内，可先完成一次匹配后查看',
    '办理': '办理指引建设中：每条权益的「怎么办理 / 去哪里核实」与官方渠道已在详情页内',
    '权益': '我的权益规划中：当前可在底部「发现」里查看您的匹配结果',
  };
  document.querySelectorAll('.hg-tile.is-todo').forEach((btn) => {
    btn.addEventListener('click', () => showToast(TODO_MSG[btn.dataset.todo] || '功能建设中'));
  });

  renderHomeProfile();
  renderDiscoverCard();

  // 城市相关文案等站点上下文就绪后再落笔（接口不可用时保持占位文案）
  loadSiteContext().then(() => {
    document.getElementById('demoEntryDesc').textContent = demoProfile().desc;
    document.getElementById('footScope').textContent =
      '数据范围：' + SITE.region + '公共服务政策数据（逐条标注责任部门与核验状态）';
  });
</script>
<script>
  // 比赛演示模式：点击后先弹出虚拟案例确认卡，评委确认后再进入流程。
  // 案例内容随当前政策库覆盖城市变化（见 app.js 的 DEMO_PROFILES）。
  document.getElementById('demoEntry').addEventListener('click', async () => {
    await loadSiteContext();
    showDemoConfirm();
  });

  function showDemoConfirm() {
    if (document.getElementById('demoOverlay')) return;
    const p = demoProfile();
    const rows = p.rows.map((r) => '<div class="dc-row"><span class="k">'
      + escapeHtml(r[0]) + '</span><span class="v">' + escapeHtml(r[1]) + '</span></div>').join('');
    const overlay = document.createElement('div');
    overlay.id = 'demoOverlay';
    overlay.className = 'demo-overlay';
    overlay.innerHTML = `
      <div class="demo-confirm-card">
        <div class="demo-confirm-head">
          <span class="demo-confirm-badge">演示案例</span>
          <span class="demo-confirm-title">虚拟案例信息</span>
        </div>
        <div class="demo-confirm-rows">${rows}</div>
        <p class="demo-confirm-note">以下为虚拟案例，不代表真实个人情况。</p>
        <p class="demo-confirm-desc">确认后将进入家庭协助页，每一步都由您手动操作体验。</p>
        <div class="demo-confirm-actions">
          <button type="button" class="btn ghost" id="demoCancelBtn">取消</button>
          <button type="button" class="btn" id="demoConfirmBtn">确认案例并开始体验</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('demoCancelBtn').addEventListener('click', () => overlay.remove());
    document.getElementById('demoConfirmBtn').addEventListener('click', () => {
      store.write({
        target: 'parents',
        operator: '女儿',
        beneficiary: p.who,
        confirmed: true,
        demo: true,
        demoBanner: true,
        profile: {},
        text: demoText(p.who),
      });
      location.href = 'family.html';
    });
  }
</script>
</body>
</html>
